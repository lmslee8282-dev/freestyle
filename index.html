
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeStyle 꿀템 저장소</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
:root {
    --pink: #ed7294;
    --pink-dark: #ca557b;
    --ink: #302d36;
    --muted: #90838a;
    --line: #f2e4e7;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Pretendard','Apple SD Gothic Neo',
                 'Malgun Gothic',sans-serif;
}

body {
    min-height: 100vh;
    padding: 0 15px 55px;
    color: var(--ink);
    background: linear-gradient(
        165deg,#fff9f8,#f9eceb,#fff7f4
    );
}

.container {
    width: 100%;
    max-width: 510px;
    margin: auto;
    text-align: center;
}

#profile-container {
    padding-top: 42px;
}

.profile-img {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100px;
    height: 100px;
    margin: 0 auto 16px;
    border: 4px solid white;
    border-radius: 50%;
    background: #fce5e9;
    object-fit: cover;
    font-size: 32px;
    box-shadow: 0 6px 24px #b57e8924;
}

h1 {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -.6px;
}

.sub {
    margin: 9px 0 20px;
    color: #9c8991;
    font-size: 13px;
    line-height: 1.6;
}

.top-accent {
    width: 42px;
    height: 4px;
    margin: 0 auto 27px;
    border-radius: 5px;
    background: #e9a5b6;
}

/* 검색 */
.search-box {
    position: relative;
    margin-bottom: 13px;
}

.search-input {
    width: 100%;
    height: 49px;
    padding: 0 45px 0 43px;
    border: 1px solid #f0dde3;
    border-radius: 14px;
    background: white;
    color: var(--ink);
    font-size: 14px;
    outline: none;
    box-shadow: 0 4px 16px #8c61670d;
}

.search-input:focus {
    border-color: var(--pink);
}

.search-icon {
    position: absolute;
    top: 13px;
    left: 15px;
    font-size: 19px;
}

.search-clear {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 50%;
    background: #f6eef1;
    color: #837780;
    cursor: pointer;
}

.search-clear[hidden] {
    display: none;
}

.list-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 18px 2px 16px;
    font-size: 12px;
}

.list-toolbar strong {
    font-size: 13px;
}

.list-count {
    color: var(--muted);
}

#content-list {
    text-align: left;
}

/* 그룹 */
.group-container {
    margin-bottom: 26px;
}

.group-title {
    margin-bottom: 8px;
    padding: 0 3px 11px;
    color: var(--pink-dark);
    font-size: 14px;
    font-weight: 800;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

/* 상품 카드 */
.items-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.items-wrap.carousel {
    flex-wrap: nowrap;
    overflow-x: auto;
    padding: 5px 1px 13px;
    scroll-snap-type: x proximity;
}

.item-card {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    min-height: 75px;
    padding: 12px;
    border: 1px solid #f6eeee;
    border-radius: 16px;
    background: white;
    color: var(--ink);
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 4px 16px #8c61670d;
    transition: transform .2s,box-shadow .2s;
}

.item-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 9px 24px #aa68751a;
}

.item-card:active {
    transform: scale(.985);
}

.item-img {
    width: 58px;
    height: 58px;
    flex-shrink: 0;
    border-radius: 11px;
    background: #f8eeee;
    object-fit: cover;
}

.item-info {
    flex: 1;
    min-width: 0;
    text-align: left;
}

.item-title {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
    font-size: 13px;
    font-weight: 650;
    line-height: 1.5;
}

.item-card.list::after {
    content: '›';
    margin-left: auto;
    color: #b5a3a9;
    font-size: 25px;
}

.item-card.col2,
.item-card.col3,
.item-card.carousel1,
.item-card.carousel2 {
    flex-direction: column;
    text-align: center;
    gap: 8px;
}

.item-card.col2 {
    width: calc(50% - 5px);
}

.item-card.col3 {
    width: calc(33.333% - 7px);
    padding: 8px;
}

.item-card.carousel1 {
    width: 75%;
    flex-shrink: 0;
    scroll-snap-align: start;
}

.item-card.carousel2 {
    width: 50%;
    flex-shrink: 0;
    scroll-snap-align: start;
}

.item-card.col2 .item-img,
.item-card.carousel2 .item-img {
    width: 100%;
    height: 112px;
}

.item-card.col3 .item-img {
    width: 100%;
    height: 75px;
}

.item-card.carousel1 .item-img {
    width: 100%;
    height: 150px;
}

.item-card.col2 .item-info,
.item-card.col3 .item-info,
.item-card.carousel1 .item-info,
.item-card.carousel2 .item-info {
    width: 100%;
    text-align: center;
}

.item-card.col3 .item-title {
    font-size: 11px;
    -webkit-line-clamp: 1;
}

/* 더 보기 */
.more-button {
    display: block;
    width: 100%;
    margin: 12px 0 25px;
    padding: 15px;
    border: 1px solid #ecc7d2;
    border-radius: 14px;
    background: #fff;
    color: var(--pink-dark);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 15px #8c61670d;
}

.more-button:hover {
    background: #fff0f4;
}

.more-button[hidden] {
    display: none;
}

.empty-state {
    padding: 35px 15px;
    border-radius: 16px;
    background: white;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
}

.footer {
    margin-top: 38px;
    color: #b8a3a9;
    font-size: 11px;
}

/* PC */
@media(min-width:700px) {
    body {
        padding-top: 32px;
    }

    .container {
        max-width: 620px;
        padding: 0 25px 25px;
        border: 1px solid #faeeee;
        border-radius: 32px;
        background: #fff9f9a8;
        box-shadow: 0 18px 55px #aa7b8817;
    }
}

/* 모바일 */
@media(max-width:360px) {
    .item-card {
        padding: 10px;
        gap: 9px;
    }

    .item-img {
        width: 52px;
        height: 52px;
    }

    .item-title {
        font-size: 12px;
    }
}
    
/* 프로필 로딩 중 깜빡임 방지 */
.profile-loading {
    background: #f4e8ed;
    border: 4px solid #fff;
    animation: profilePulse 1.4s ease-in-out infinite;
}

@keyframes profilePulse {
    0%, 100% { opacity: 0.65; }
    50% { opacity: 1; }
}

#profile-container {
    min-height: 120px;
}

#profile-container img.profile-img {
    display: block;
    object-fit: cover;
    animation: none;
}

</style>
</head>

<body>
<div class="container">

    
<div id="profile-container">
    <div class="profile-img profile-loading"
         id="profilePlaceholder"></div>
</div>


    <h1>FreeStyle 꿀템 저장소</h1>

    <p class="sub">
        쇼츠에서 소개한 좋은 아이템들을 한곳에 모았어요 ♡
    </p>

    <div class="top-accent"></div>

    <div class="search-box">
        <span class="search-icon">⌕</span>

        <input
            id="productSearch"
            class="search-input"
            type="search"
            placeholder="영상 제목 또는 상품명 검색"
            autocomplete="off"
            aria-label="상품 검색">

        <button
            id="clearSearch"
            class="search-clear"
            type="button"
            aria-label="검색어 지우기"
            hidden>✕</button>
    </div>

    <div class="list-toolbar">
        <strong id="listHeading">최신 추천 상품</strong>
        <span id="listCount" class="list-count"></span>
    </div>

    <div id="content-list">
        <div class="empty-state">
            상품을 불러오는 중입니다...
        </div>
    </div>

    <button
        id="loadMoreButton"
        class="more-button"
        type="button"
        hidden>
        이전 상품 더 보기 ↓
    </button>

    <div class="footer">
        © 2026 FreeStyle. All rights reserved.
    </div>

</div>

<script>
/* Firebase */
const firebaseConfig = {
    apiKey: "AIzaSyCMy4vdbdLd26v8l2kGTsCW-IZaGklqwLs",
    authDomain: "freestyle-db-becce.firebaseapp.com",
    projectId: "freestyle-db-becce",
    storageBucket: "freestyle-db-becce.firebasestorage.app",
    messagingSenderId: "811035384445",
    appId: "1:811035384445:web:490ffeb5f09cb763f0ef14",
    measurementId: "G-FY7T44KY7D"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

/* 페이지 설정 */
const PAGE_SIZE = 10;

let productsData = {};
let visibleCount = PAGE_SIZE;
let searchKeyword = '';
let groupList = [];
let groupOrderMeta = {};

const contentList = document.getElementById('content-list');
const moreButton = document.getElementById('loadMoreButton');
const searchInput = document.getElementById('productSearch');
const clearButton = document.getElementById('clearSearch');

/* Firebase Push ID의 생성 시각 추출 */
function getPushTime(id) {
    const chars =
        '-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';

    if (typeof id !== 'string' || id.length < 20) {
        return 0;
    }

    let time = 0;

    for (let i = 0; i < 8; i++) {
        const n = chars.indexOf(id.charAt(i));
        if (n < 0) return 0;
        time = time * 64 + n;
    }

    return Number.isSafeInteger(time) ? time : 0;
}

function safeImage(src) {
    if (typeof src !== 'string') return '';

    if (/^https?:\/\//i.test(src) ||
        /^data:image\/(png|jpeg|webp|gif);base64,/i.test(src)) {
        return src;
    }

    return '';
}

function safeLink(url) {
    try {
        const parsed = new URL(url);
        return ['http:', 'https:'].includes(parsed.protocol)
            ? parsed.href : '';
    } catch {
        return '';
    }
}

/* 상품 데이터로 그룹 목록 생성 */
function buildGroups() {
    const groups = new Map();

    Object.entries(productsData).forEach(([id, item]) => {
        if (!item || !item.group) return;

        // 숨김 상품도 정렬 시점 계산에는 포함
        if (!groups.has(item.group)) {
            groups.set(item.group, {
                name: item.group,
                items: [],
                createdAt: Infinity,
                firstKey: id
            });
        }

        const group = groups.get(item.group);

        const createdAt =
            Number(item.groupCreatedAt) ||
            getPushTime(id);

        if (createdAt > 0) {
            group.createdAt =
                Math.min(group.createdAt, createdAt);
        }

        if (id < group.firstKey) group.firstKey = id;

        if (item.active !== false) {
            group.items.push({
                ...item,
                id
            });
        }
    });

    groupList = [...groups.values()]
        .filter(group => group.items.length > 0)
        .map(group => {
            // 메타데이터가 있으면 최초 등록 순서를 우선 사용
            const meta = groupOrderMeta[group.name];
            const metaTime = Number(meta?.createdAt);

            if (Number.isFinite(metaTime) && metaTime > 0) {
                group.createdAt = metaTime;
            }

            group.items.sort((a, b) =>
                (Number(a.order) || 0) -
                (Number(b.order) || 0)
            );

            if (!Number.isFinite(group.createdAt)) {
                group.createdAt = 0;
            }

            return group;
        })
        .sort((a, b) => {
            if (b.createdAt !== a.createdAt) {
                return b.createdAt - a.createdAt;
            }

            return b.firstKey.localeCompare(a.firstKey);
        });
}

/* 검색 */
function getFilteredGroups() {
    if (!searchKeyword) return groupList;

    return groupList
        .map(group => {
            const matchesGroup =
                group.name.toLowerCase()
                    .includes(searchKeyword);

            const matchedItems = matchesGroup
                ? group.items
                : group.items.filter(item =>
                    String(item.title || '')
                        .toLowerCase()
                        .includes(searchKeyword)
                );

            return {
                ...group,
                items: matchedItems
            };
        })
        .filter(group => group.items.length > 0);
}

/* 클릭 통계 기록 + 링크 이동 */
function handleItemClick(id, url) {
    const target = safeLink(url);

    if (!target) {
        alert('상품 링크를 확인할 수 없습니다.');
        return;
    }

    // 사용자 클릭 시 즉시 이동할 수 있도록 창을 먼저 엶
    const opened = window.open(
        'about:blank',
        '_blank'
    );

    if (opened) opened.opener = null;

    // 통계 기록이 실패해도 상품 링크는 열리도록 처리
    db.ref('products/' + id + '/clicks')
        .transaction(current => (Number(current) || 0) + 1)
        .catch(error => {
            console.warn('클릭 통계 기록 실패', error);
        });

    if (opened) {
        opened.location.replace(target);
    } else {
        window.location.href = target;
    }
}

/* 상품 카드 */
function createProductCard(item, layout) {
    const card = document.createElement('a');
    card.className = 'item-card ' + layout;

    const url = safeLink(item.link);

    card.href = url || '#';
    card.target = '_blank';
    card.rel = 'noopener noreferrer';

    const img = document.createElement('img');
    img.className = 'item-img';
    img.loading = 'lazy';
    img.alt = '상품 이미지';

    const src = safeImage(item.image);

    if (src) img.src = src;

    const info = document.createElement('div');
    info.className = 'item-info';

    const title = document.createElement('div');
    title.className = 'item-title';
    title.textContent = item.title || '상품명 없음';

    const color = item.productTextColor || '';

    if (/^#[0-9a-f]{6}$/i.test(color) &&
        color.toLowerCase() !== '#ffffff') {
        title.style.color = color;
    }

    info.appendChild(title);
    card.appendChild(img);
    card.appendChild(info);

    card.addEventListener('click', event => {
        // 직접 처리하여 새 창과 클릭 통계 연결
        event.preventDefault();
        handleItemClick(item.id, item.link);
    });

    return card;
}

/* 그룹 */
function createGroup(group) {
    const section = document.createElement('section');
    section.className = 'group-container';

    const heading = document.createElement('h2');
    heading.className = 'group-title';
    heading.textContent = '✦ ' + group.name;

    const color = group.items[0].groupColor;

    if (/^#[0-9a-f]{6}$/i.test(color || '')) {
        heading.style.color = color;
    }

    const layout = [
        'list','col2','col3','carousel1','carousel2'
    ].includes(group.items[0].layout)
        ? group.items[0].layout : 'list';

    const wrap = document.createElement('div');
    wrap.className = 'items-wrap';

    if (layout.includes('carousel')) {
        wrap.classList.add('carousel');
    }

    group.items.forEach(item => {
        wrap.appendChild(createProductCard(item, layout));
    });

    section.appendChild(heading);
    section.appendChild(wrap);

    return section;
}

/* 화면 출력 */
function renderProducts() {
    const filtered = getFilteredGroups();
    const visible = filtered.slice(0, visibleCount);

    contentList.replaceChildren();

    document.getElementById('listHeading').textContent =
        searchKeyword ? '검색 결과' : '최신 추천 상품';

    document.getElementById('listCount').textContent =
        `${filtered.length}개 그룹`;

    if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = searchKeyword
            ? '검색 결과가 없습니다. 다른 검색어를 입력해 보세요.'
            : '아직 등록된 상품이 없습니다.';
        contentList.appendChild(empty);
    } else {
        visible.forEach(group => {
            contentList.appendChild(createGroup(group));
        });
    }

    const remaining = filtered.length - visible.length;

    moreButton.hidden = remaining <= 0;

    if (remaining > 0) {
        moreButton.textContent =
            `이전 상품 더 보기 ↓ (${remaining}개 그룹 남음)`;
    }
}

/* 더 보기 */
moreButton.addEventListener('click', () => {
    visibleCount += PAGE_SIZE;
    renderProducts();
});

/* 검색 */
searchInput.addEventListener('input', () => {
    searchKeyword =
        searchInput.value.trim().toLowerCase();

    visibleCount = PAGE_SIZE;
    clearButton.hidden = !searchKeyword;

    renderProducts();
});

clearButton.addEventListener('click', () => {
    searchInput.value = '';
    searchKeyword = '';
    visibleCount = PAGE_SIZE;
    clearButton.hidden = true;
    renderProducts();
    searchInput.focus();
});

/* ======================================
   프로필 이미지 빠른 표시 + 로컬 캐시
====================================== */

const PROFILE_CACHE_KEY = 'freestyle_profile_cache_v1';
const PROFILE_CACHE_MAX = 150 * 1024;

const profileContainer =
    document.getElementById('profile-container');

let currentProfileSrc = '';

function displayProfile(src) {
    if (!src || src === currentProfileSrc) return;

    const image = new Image();
    image.className = 'profile-img';
    image.alt = 'FreeStyle 프로필 이미지';

    // 이미지를 완전히 읽은 뒤 화면 교체
    image.onload = function () {
        profileContainer.replaceChildren(image);
        currentProfileSrc = src;
    };

    image.onerror = function () {
        console.warn('프로필 이미지 표시 실패');
    };

    image.src = src;
}

function cacheProfile(src) {
    try {
        if (
            typeof src === 'string' &&
            src.length < PROFILE_CACHE_MAX
        ) {
            localStorage.setItem(PROFILE_CACHE_KEY, src);
        } else {
            localStorage.removeItem(PROFILE_CACHE_KEY);
        }
    } catch (error) {
        console.warn('프로필 캐시 저장 불가:', error);
    }
}

// 1. 재방문 시 저장된 이미지 먼저 표시
try {
    const cached = localStorage.getItem(PROFILE_CACHE_KEY);

    if (cached && safeImage(cached)) {
        displayProfile(cached);
    }
} catch (error) {
    console.warn('프로필 캐시 읽기 불가:', error);
}

// 2. Firebase 최신 이미지와 동기화
db.ref('settings/profileImg').on('value', snapshot => {
    const src = safeImage(snapshot.val());

    if (!src) {
        localStorage.removeItem(PROFILE_CACHE_KEY);
        currentProfileSrc = '';

        const placeholder = document.createElement('div');
        placeholder.className = 'profile-img';
        placeholder.textContent = '🔥';

        profileContainer.replaceChildren(placeholder);
        return;
    }

    if (src !== currentProfileSrc) {
        displayProfile(src);
    }

    cacheProfile(src);
}, error => {
    console.warn('프로필 정보 수신 실패:', error);
});


/* 최초 등록 순서 메타데이터 */
db.ref('groupOrder').on('value', snapshot => {
    groupOrderMeta = snapshot.val() || {};
    buildGroups();
    renderProducts();
});

/* 상품 실시간 구독 */
db.ref('products').on('value', snapshot => {
    productsData = snapshot.val() || {};
    buildGroups();
    renderProducts();
}, error => {
    console.error(error);
    contentList.textContent =
        '상품을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.';
});

</script>
</body>
</html>
