
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeStyle 상품 관리</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<style>
:root {
    --pink: #ed7295;
    --pink-dark: #d85178;
    --pink-light: #fff0f4;
    --bg: #f9f4f6;
    --white: #ffffff;
    --text: #302d36;
    --muted: #8c8490;
    --line: #eee4e9;
    --shadow: 0 8px 28px rgba(72,45,62,.06);
}

* {
    box-sizing: border-box;
    font-family: 'Pretendard','Apple SD Gothic Neo',
                 'Malgun Gothic',sans-serif;
}

body {
    margin: 0;
    padding: 30px 20px;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
}

.admin-wrapper {
    max-width: 1250px;
    margin: auto;
    display: grid;
    grid-template-columns: 300px minmax(0,1fr);
    gap: 25px;
    align-items: start;
}

/* 모바일 미리보기 */
.preview-pane {
    position: sticky;
    top: 24px;
    padding: 12px;
    border: 5px solid #e8dee3;
    border-radius: 35px;
    background: white;
    box-shadow: var(--shadow);
}

.preview-label {
    padding: 5px 0 12px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
}

.preview-screen {
    height: 570px;
    overflow-y: auto;
    padding: 22px 13px;
    background: #fbf0f3;
    border-radius: 24px;
    scrollbar-width: thin;
}

.preview-profile {
    width: 70px;
    height: 70px;
    display: block;
    margin: 10px auto;
    border-radius: 50%;
    background: white;
    border: 3px solid white;
    object-fit: cover;
}

.preview-title {
    text-align: center;
    font-size: 16px;
    font-weight: 800;
}

.preview-subtitle {
    margin: 8px 0 25px;
    color: #91868d;
    font-size: 11px;
    text-align: center;
}

.preview-group-box {
    margin-top: 20px;
}

.preview-group-title {
    margin-bottom: 11px;
    padding-bottom: 10px;
    border-bottom: 1px solid #eadbe0;
    font-size: 12px;
    font-weight: 800;
}

.preview-items-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.preview-items-wrap.carousel {
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-bottom: 8px;
}

.preview-item-card {
    width: 100%;
    flex-shrink: 0;
    padding: 9px;
    border: 1px solid #f1e6e9;
    border-radius: 11px;
    background: white;
    text-align: center;
    overflow: hidden;
}

.preview-item-card.list {
    display: flex;
    align-items: center;
    gap: 9px;
    text-align: left;
}

.preview-item-card.col2 {
    width: calc(50% - 4px);
}

.preview-item-card.col3 {
    width: calc(33.333% - 6px);
}

.preview-item-card.carousel1 {
    width: 75%;
}

.preview-item-card.carousel2 {
    width: 50%;
}

.preview-item-img {
    width: 100%;
    height: 65px;
    border-radius: 7px;
    object-fit: cover;
    background: #f4edf0;
}

.preview-item-card.list .preview-item-img {
    width: 45px;
    height: 45px;
    flex-shrink: 0;
}

.preview-item-text {
    margin-top: 5px;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.preview-item-card.list .preview-item-text {
    margin: 0;
}

/* 관리자 패널 */
.admin-box {
    min-width: 0;
    padding: 30px;
    background: white;
    border: 1px solid #f0e7eb;
    border-radius: 24px;
    box-shadow: var(--shadow);
}

.top-title {
    margin: 0 0 7px;
    font-size: 25px;
    letter-spacing: -.8px;
}

.top-desc {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
}

/* 요약 통계 */
.summary-grid {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 11px;
    margin-bottom: 26px;
}

.summary-card {
    padding: 17px;
    background: #fff8fa;
    border: 1px solid #f6e4ea;
    border-radius: 15px;
}

.summary-label {
    color: var(--muted);
    font-size: 12px;
}

.summary-value {
    margin-top: 8px;
    font-size: 25px;
    font-weight: 800;
    color: var(--pink-dark);
}

/* 탭 */
.tab-menu {
    display: flex;
    gap: 8px;
    padding: 6px;
    margin-bottom: 28px;
    border-radius: 13px;
    background: #f8f5f7;
}

.tab-btn {
    flex: 1;
    min-width: 0;
    padding: 13px 6px;
    background: transparent;
    border: 0;
    border-radius: 10px;
    color: #837a84;
    font-size: 13px;
    font-weight: 700;
}

.tab-btn.active {
    background: var(--pink);
    color: white;
    box-shadow: 0 3px 12px rgba(237,114,149,.20);
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

h3 {
    margin: 18px 0;
    font-size: 18px;
}

label.field-label {
    display: block;
    margin: 17px 0 8px;
    color: #655c65;
    font-size: 13px;
    font-weight: 700;
}

input[type=text],
input[type=url],
input[type=search] {
    width: 100%;
    min-width: 0;
    padding: 12px 13px;
    border: 1px solid #e7dfe4;
    border-radius: 10px;
    background: #fcfafb;
    color: var(--text);
    outline: none;
    font-size: 13px;
}

input:focus {
    border-color: var(--pink);
}

input::placeholder {
    color: #aaa0a9;
}

.group-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

.group-title-row > input {
    flex: 1;
}

.inline-color-picker {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--muted);
    font-size: 11px;
}

input[type=color] {
    width: 28px;
    height: 28px;
    border: 0;
    background: transparent;
    cursor: pointer;
}

/* 레이아웃 */
.layout-selector {
    display: grid;
    grid-template-columns: repeat(5,minmax(0,1fr));
    gap: 8px;
}

.layout-option {
    padding: 13px 5px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fcfafb;
    color: #716a73;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}

.layout-option input {
    display: none;
}

.layout-option.selected {
    border-color: var(--pink);
    background: var(--pink-light);
    color: var(--pink-dark);
}

/* 상품 입력 */
.product-input-card {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: white;
}

.product-input-card.dragging {
    opacity: .45;
    background: #fff0f4;
}

.drag-handle {
    cursor: grab;
    color: #aaa0a9;
    font-size: 20px;
    user-select: none;
}

.image-box {
    position: relative;
    flex-shrink: 0;
}

.image-drop-zone {
    position: relative;
    width: 76px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px dashed #e8bccc;
    border-radius: 10px;
    background: #fff8fa;
    overflow: hidden;
    cursor: pointer;
}

.image-drop-zone.dragover {
    border-color: var(--pink);
    background: #ffe8ee;
}

.plus-icon {
    font-size: 24px;
    color: var(--pink);
}

.image-drop-zone img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.btn-delete-img {
    position: absolute;
    right: -5px;
    bottom: -5px;
    width: 24px;
    height: 24px;
    border: 0;
    border-radius: 50%;
    background: var(--pink);
    color: white;
    font-size: 12px;
}

.card-fields {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.title-input-row {
    display: flex;
    align-items: center;
    gap: 7px;
}

.title-input-row > input {
    flex: 1;
}

.card-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
    height: 76px;
}

.switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    background: #d4ccd2;
    cursor: pointer;
}

.slider:before {
    content: "";
    position: absolute;
    left: 3px;
    top: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: white;
    transition: .2s;
}

.switch input:checked + .slider {
    background: var(--pink);
}

.switch input:checked + .slider:before {
    transform: translateX(18px);
}

.btn-row-delete {
    border: none;
    background: transparent;
    font-size: 19px;
}

.btn-add-row {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: 1px dashed #e9afc0;
    border-radius: 11px;
    background: #fff0f4;
    color: var(--pink-dark);
    font-weight: 800;
}

.btn-action,
.btn-profile {
    width: 100%;
    margin-top: 17px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: var(--pink);
    color: white;
    font-size: 14px;
    font-weight: 800;
}

.btn-action:hover,
.btn-profile:hover {
    background: var(--pink-dark);
}

.btn-action:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.btn-cancel {
    background: #aaa3ad;
}

.divider {
    margin: 30px 0;
    border: none;
    border-top: 1px solid var(--line);
}

/* 등록 그룹 */
.search-input {
    margin-bottom: 15px;
}

.item-list,
.analytics-section {
    max-height: 480px;
    overflow-y: auto;
}

.admin-item,
.analytics-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px;
    margin-bottom: 9px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: white;
}

.admin-item-info {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
    flex: 1;
}

.admin-thumb {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 9px;
    object-fit: cover;
    background: #f0edf0;
}

.item-name {
    min-width: 0;
    overflow-wrap: anywhere;
    font-size: 13px;
    font-weight: 700;
}

.item-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
}

.admin-btn-group {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
}

.btn-edit,
.btn-del {
    padding: 9px 11px;
    border: none;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
}

.btn-edit {
    background: #eaf6ee;
    color: #268953;
}

.btn-del {
    background: #fff0f2;
    color: #d85b75;
}

.click-count {
    flex-shrink: 0;
    padding: 6px 10px;
    border-radius: 20px;
    background: var(--pink-light);
    color: var(--pink-dark);
    font-size: 12px;
    font-weight: 800;
}

.profile-preview-box {
    margin: 20px 0;
    text-align: center;
}

.current-profile-img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    background: #f0edf0;
}

.file-box {
    padding: 13px;
    border: 1px dashed #e8c4cf;
    border-radius: 12px;
    background: #fffafb;
}

.help-text {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
}

.empty-text {
    padding: 25px;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
}

@media(max-width:900px) {
    .admin-wrapper {
        grid-template-columns: 1fr;
    }

    .preview-pane {
        position: static;
        max-width: 370px;
        width: 100%;
        margin: auto;
    }
}

@media(max-width:540px) {
    body {
        padding: 12px;
    }

    .admin-box {
        padding: 18px 13px;
    }

    .top-title {
        font-size: 21px;
    }

    .summary-card {
        padding: 12px 8px;
    }

    .summary-value {
        font-size: 20px;
    }

    .tab-btn {
        font-size: 11px;
        padding: 11px 3px;
    }

    .layout-selector {
        grid-template-columns: repeat(3,1fr);
    }

    .product-input-card {
        gap: 7px;
        padding: 10px;
    }

    .image-drop-zone {
        width: 55px;
        height: 60px;
    }

    .card-fields input {
        font-size: 11px;
        padding: 9px 7px;
    }

    .title-input-row .inline-color-picker {
        font-size: 0;
        padding: 4px;
    }

    .admin-item {
        flex-wrap: wrap;
    }

    .admin-btn-group {
        margin-left: auto;
    }
}
    
/* ===== 관리자 로그인 UI ===== */
[hidden] {
    display: none !important;
}

.login-screen {
    min-height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-card {
    width: 100%;
    max-width: 400px;
    padding: 38px 30px;
    background: #ffffff;
    border-radius: 22px;
    box-shadow: 0 12px 40px rgba(80, 40, 60, 0.1);
    text-align: center;
}

.login-logo {
    font-size: 42px;
    margin-bottom: 12px;
}

.login-card h2 {
    text-align: center;
    font-size: 24px;
    color: #30313b;
    margin-bottom: 10px;
}

.login-desc {
    color: #918792;
    font-size: 13px;
    margin-bottom: 26px;
}

.login-input {
    display: block;
    width: 100%;
    height: 48px;
    margin: 11px 0;
    padding: 0 15px;
    border: 1px solid #e8dfe4;
    border-radius: 11px;
    background: #fcfafb;
    font-size: 14px;
}

.login-input:focus {
    outline: none;
    border-color: #ed7295;
}

.login-button {
    width: 100%;
    margin-top: 17px;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    background: #ed7295;
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
}

.login-button:disabled {
    opacity: .55;
    cursor: wait;
}

.login-error {
    min-height: 20px;
    margin-top: 15px;
    color: #d84f70;
    font-size: 12px;
    line-height: 1.6;
}

.admin-session {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
    padding: 12px 15px;
    background: #fff3f6;
    border-radius: 12px;
}

.admin-email {
    font-size: 12px;
    color: #605763;
    overflow-wrap: anywhere;
}

.logout-button {
    width: auto;
    flex-shrink: 0;
    margin: 0;
    padding: 9px 13px;
    border: 1px solid #f2c3d0;
    border-radius: 9px;
    background: white;
    color: #d45277;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

/* ===== 고객 페이지 실시간 목록 ===== */

.customer-list-panel {
    margin-top: 18px;
    padding: 15px;
    border: 1px solid #eee0e5;
    border-radius: 18px;
    background: #fff;
}

.customer-list-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.customer-list-heading strong {
    font-size: 13px;
    color: #34313b;
}

.customer-list-count {
    font-size: 11px;
    color: #9a8991;
}

.customer-list-scroll {
    max-height: 420px;
    overflow-y: auto;
    padding-right: 3px;
}

.customer-group {
    margin-bottom: 15px;
}

.customer-group-title {
    margin-bottom: 8px;
    font-size: 12px;
    font-weight: 800;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.customer-product {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px;
    margin-bottom: 6px;
    border: 1px solid #f2e8eb;
    border-radius: 10px;
    background: #fff9fa;
    color: #302d36;
    text-decoration: none;
}

.customer-product img {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 7px;
    object-fit: cover;
    background: #f2edf0;
}

.customer-product span {
    flex: 1;
    min-width: 0;
    font-size: 11px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.customer-product:hover {
    background: #fff0f4;
}

.customer-list-more {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #edc5d0;
    border-radius: 10px;
    background: #fff0f4;
    color: #ce5579;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.customer-list-empty {
    padding: 20px 5px;
    text-align: center;
    font-size: 12px;
    color: #9a8991;
}

</style>
</head>

<body>

<!-- Firebase 관리자 로그인 -->
<div id="loginScreen" class="login-screen">

    <div class="login-card">
        <div class="login-logo">🔐</div>

        <h2>FreeStyle 관리자</h2>

        <p class="login-desc">
            관리자 계정으로 로그인해 주세요.
        </p>

        <form id="adminLoginForm"
              onsubmit="adminLogin(event)">

            <input
                type="email"
                id="adminEmail"
                class="login-input"
                placeholder="관리자 이메일"
                autocomplete="username"
                required>

            <input
                type="password"
                id="adminPassword"
                class="login-input"
                placeholder="비밀번호"
                autocomplete="current-password"
                required>

            <button type="submit"
                    id="loginButton"
                    class="login-button">
                로그인
            </button>

        </form>

        <div id="loginError"
             class="login-error"
             role="alert"></div>
    </div>
</div>

<div class="admin-wrapper" id="adminWrapper" hidden>

    <!-- 모바일 미리보기 -->
    <aside class="preview-pane">
        <div class="preview-label">LIVE PREVIEW</div>

        <div class="preview-screen" id="livePreviewScreen">
            <img id="prevProfileImg"
                 class="preview-profile"
                 alt="프로필">

            <div class="preview-title">
                FreeStyle 꿀템 저장소
            </div>

            <div class="preview-subtitle">
                쇼츠 속 추천 꿀템을 만나보세요!
            </div>

            <div class="preview-group-box">
                <div class="preview-group-title"
                     id="prevGroupTitle">
                    대표 문구를 입력하세요
                </div>

                <div class="preview-items-wrap"
                     id="prevItemsWrap">
                </div>
            </div>
        </div>
    </aside>

    <!-- 관리자 패널 -->
    <main class="admin-box">

<div class="admin-session">
    <span id="loggedInEmail" class="admin-email"></span>

    <button type="button"
            class="logout-button"
            onclick="adminLogout()">
        로그아웃
    </button>
</div>

        <h1 class="top-title">FreeStyle 관리자</h1>
        <p class="top-desc">
            상품 등록부터 클릭 통계까지 한 곳에서 관리하세요.
        </p>

        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-label">전체 그룹</div>
                <div class="summary-value" id="totalGroups">0</div>
            </div>

            <div class="summary-card">
                <div class="summary-label">게시 상품</div>
                <div class="summary-value" id="activeProducts">0</div>
            </div>

            <div class="summary-card">
                <div class="summary-label">누적 클릭</div>
                <div class="summary-value" id="totalClicks">0</div>
            </div>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active"
                    data-tab="manage"
                    onclick="switchTab('manage')">
                📦 상품 관리
            </button>

function escapeHTML(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function isSafeImageSource(value) {
    if (typeof value !== 'string') return false;

    return /^https:\/\//i.test(value) ||
        /^data:image\/(png|jpeg|jpg|webp|gif);base64,/i.test(value);
}

function safeImage(value) {
    return isSafeImageSource(value) ? value : '';
}

function formatNumber(value) {
    return Number(value || 0).toLocaleString('ko-KR');
}

function readFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
    });
}
    
/* ========================================
   상품 이미지 자동 최적화
   - 긴 변 최대 600px
   - WebP 우선, 미지원 시 JPEG
   - 원본보다 커지면 원본 유지
======================================== */

const IMAGE_MAX_SIZE = 600;
const IMAGE_QUALITY = 0.72;

function dataURLBytes(dataURL) {
    const base64 = String(dataURL).split(',')[1] || '';
    const padding = (base64.match(/=+$/) || [''])[0].length;
    return Math.max(0, Math.floor(base64.length * 3 / 4) - padding);
}

function formatKB(bytes) {
    return (bytes / 1024).toFixed(1) + 'KB';
}

function loadImageElement(src) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('이미지 로딩 실패'));
        img.src = src;
    });
}

async function compressImageDataURL(source) {
    if (!source || !source.startsWith('data:image/')) {
        throw new Error('지원하지 않는 이미지 데이터입니다.');
    }

    const img = await loadImageElement(source);

    const originalWidth = img.naturalWidth;
    const originalHeight = img.naturalHeight;

    const scale = Math.min(
        1,
        IMAGE_MAX_SIZE / Math.max(originalWidth, originalHeight)
    );

    const width = Math.max(1, Math.round(originalWidth * scale));
    const height = Math.max(1, Math.round(originalHeight * scale));

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext('2d');

    if (!ctx) {
        throw new Error('이미지 압축 기능을 사용할 수 없습니다.');
    }

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // 투명 배경을 흰색으로 처리
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);

    ctx.drawImage(img, 0, 0, width, height);

    let compressed = canvas.toDataURL(
        'image/webp',
        IMAGE_QUALITY
    );

    // WebP 미지원 브라우저 대비
    if (!compressed.startsWith('data:image/webp;')) {
        compressed = canvas.toDataURL(
            'image/jpeg',
            IMAGE_QUALITY
        );
    }

    const originalBytes = dataURLBytes(source);
    const compressedBytes = dataURLBytes(compressed);

    return {
        dataURL: compressedBytes < originalBytes
            ? compressed : source,
        originalBytes,
        compressedBytes: Math.min(originalBytes, compressedBytes),
        originalWidth,
        originalHeight,
        width,
        height
    };
}

async function compressImageFile(file) {
    if (!file.type.startsWith('image/')) {
        throw new Error('이미지 파일만 등록할 수 있습니다.');
    }

    // SVG, GIF 애니메이션 등은 이 함수에서 변환하지 않음
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
        throw new Error('JPG, PNG, WebP 이미지만 지원합니다.');
    }

    const source = await readFile(file);
    return compressImageDataURL(source);
}

function getDragAfterElement(container, y) {
    const elements = [
        ...container.querySelectorAll(
            '.product-input-card:not(.dragging)'
        )
    ];

    return elements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;

        if (offset < 0 && offset > closest.offset) {
            return {
                offset,
                element: child
            };
        }

        return closest;
    }, {
        offset: Number.NEGATIVE_INFINITY
    }).element;
}

document.getElementById('productRowsContainer')
    .addEventListener('dragover', event => {

        event.preventDefault();

        const container =
            document.getElementById('productRowsContainer');

        const dragging =
            container.querySelector('.dragging');

        if (!dragging) return;

        const after =
            getDragAfterElement(container, event.clientY);

        if (after) {
            container.insertBefore(dragging, after);
        } else {
            container.appendChild(dragging);
        }
    });

function getPushTime(id) {
    const chars =
        '-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';

    if (typeof id !== 'string' || id.length < 20) {
        return 0;
    }

    let time = 0;

    for (let i = 0; i < 8; i++) {
        const n = chars.indexOf(id[i]);
        if (n < 0) return 0;
        time = time * 64 + n;
    }

    return Number.isSafeInteger(time) ? time : 0;
}

            card.querySelector('.row-textcolor').value,

    if (items.some(item =>

        alert('상품 URL은 http 또는 https로 시작해야 합니다.');

    // 다른 그룹과 동일한 이름인지 확인
    const duplicate = Object.values(allProductsData)
        .some(item =>

        );

    if (duplicate) {
        alert('동일한 그룹 제목이 이미 존재합니다.');
        return;
    }

    const button = document.getElementById('submitBtn');
    button.disabled = true;
    button.textContent = '저장 중...';

    try {
        const updates = {};

// 기존 그룹 최초 등록 시각 유지
const originalItems = Object.entries(allProductsData)
    .filter(([id, item]) =>
        editingGroupName && item.group === editingGroupName
    );

const originalTimes = originalItems
    .map(([id, item]) =>
        Number(item.groupCreatedAt) || getPushTime(id)
    )
    .filter(time => time > 0);

const groupCreatedAt = originalTimes.length
    ? Math.min(...originalTimes)
    : Date.now();

        const currentIds = new Set(
            items.map(item => item.id).filter(Boolean)
        );

        // 편집 중 제거된 기존 상품만 삭제
        if (editingGroupName) {
            Object.entries(allProductsData).forEach(
                ([id, item]) => {
                    if (
                        item.group === editingGroupName &&
                        !currentIds.has(id)
                    ) {
                        updates['products/' + id] = null;
                    }
                }
            );
        }

        for (const item of items) {
            const id = item.id && editingGroupName
                ? item.id
                : db.ref('products').push().key;

            const oldProduct = allProductsData[id];
const originalCreatedAt = editingGroupName
    ? Math.min(
        ...Object.values(allProductsData)
            .filter(p => p && p.group === editingGroupName)
            .map(p => Number(p.createdAt) || Date.now())
    )
    : Date.now();
            
            const { id: ignoredId, ...record } = item;
record.groupCreatedAt = groupCreatedAt;
            if (oldProduct) {
                // 기존 레코드의 clicks는 건드리지 않음
                Object.entries(record).forEach(
                    ([field, value]) => {
                        updates[
                            'products/' + id + '/' + field
                        ] = value;
                    }
                );
            } else {
                updates['products/' + id] = {
    ...record,
    createdAt: originalCreatedAt,
    clicks: 0
};
            }
        }

        await db.ref().update(updates);

        alert(
            editingGroupName
            ? '그룹이 수정되었습니다. 클릭 통계는 유지됩니다.'
            : '그룹 상품이 등록되었습니다.'
        );

        resetFormMode();

    } catch (error) {
        console.error('상품 저장 오류', error);
        alert('상품 저장 실패: ' + error.message);
    } finally {
        button.disabled = false;
        button.textContent =
            document.getElementById('editingGroupName').value
            ? '💾 수정 사항 저장하기'
            : '🚀 그룹 상품 등록하기';
    }
}

/* ========================================
   그룹 수정
======================================== */

function editGroup(groupName) {
    const groupItems =
        Object.entries(allProductsData)
            .filter(([id, item]) =>
                item.group === groupName
            )
            .map(([id, item]) => ({
                ...item,
                id
            }))
            .sort((a, b) =>
                (a.order || 0) - (b.order || 0)
            );

    if (!groupItems.length) {
        alert('그룹을 찾을 수 없습니다.');
        return;
    }

    switchTab('manage');

    document.getElementById('editingGroupName').value =
        groupName;

    document.getElementById('groupTitleInput').value =
        groupName;

    document.getElementById('formModeTitle').textContent =
        '✏️ 그룹 수정: ' + groupName;

    document.getElementById('submitBtn').textContent =
        '💾 수정 사항 저장하기';

    document.getElementById('cancelBtn').style.display =
        'block';

    document.getElementById('productRowsContainer')
        .replaceChildren();

    document.getElementById('groupTextColor').value =
        groupItems[0].groupColor || '#ed7295';

    setLayout(groupItems[0].layout || 'list');

    groupItems.forEach(item => {
        addProductRow(
            item.title || '',
            item.link || '',
            item.image || '',
            item.productTextColor || '#302d36',
            item.active !== false,
            item.id
        );
    });

    updateLivePreview();

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}

/* ========================================
   신규 등록 상태로 초기화
======================================== */

function resetFormMode() {
    document.getElementById('editingGroupName').value = '';
    document.getElementById('groupTitleInput').value = '';

    document.getElementById('formModeTitle').textContent =
        '➕ 그룹 상품 등록';

    document.getElementById('submitBtn').textContent =
        '🚀 그룹 상품 등록하기';

    document.getElementById('cancelBtn').style.display =
        'none';

    document.getElementById('groupTextColor').value =
        '#ed7295';

    document.getElementById('productRowsContainer')
        .replaceChildren();

    setLayout('list');
    addProductRow();
    updateLivePreview();
}

/* ========================================
   그룹 삭제
======================================== */

async function deleteGroup(groupName) {
    if (!confirm(
        "'" + groupName +
        "' 그룹의 모든 상품을 삭제하시겠습니까?"
    )) {
        return;
    }

    const updates = {};

    Object.entries(allProductsData).forEach(([id, item]) => {
        if (item.group === groupName) {
            updates['products/' + id] = null;
        }
    });

    try {
        await db.ref().update(updates);

        alert('그룹이 삭제되었습니다.');

        if (
            document.getElementById('editingGroupName').value
            === groupName
        ) {
            resetFormMode();
        }

    } catch (error) {
        console.error(error);
        alert('삭제 실패: ' + error.message);
    }
}

db.ref('settings/profileImg').on('value', snapshot => {
    const url = snapshot.val();
    const image = safeImage(url);

        document.getElementById('currentProfileView');

    const preview =
        document.getElementById('prevProfileImg');

    if (image) {

    } else {

        preview.removeAttribute('src');

});

async function updateProfileImage() {
    const input =
        document.getElementById('profileFileInput');

    if (!input.files.length) {
        alert('변경할 이미지를 선택해주세요.');
        return;
    }

    const file = input.files[0];

    if (!file.type.startsWith('image/')) {
        alert('이미지 파일만 선택해주세요.');
        return;
    }

    if (file.size > 800 * 1024) {
        alert('800KB 이하 이미지를 사용해주세요.');
        return;
    }

    try {
        const data = await readFile(file);

        // settings 전체를 덮지 않고 profileImg만 수정
        await db.ref('settings/profileImg').set(data);

        input.value = '';
        alert('프로필 이미지가 변경되었습니다.');

    } catch (error) {
        console.error(error);
        alert('프로필 저장 실패: ' + error.message);
    }
}

function updateSummary() {
    const items = Object.values(allProductsData)
        .filter(Boolean);

    const groups = new Set(
        items.map(item => item.group).filter(Boolean)
    );

    const activeCount =
        items.filter(item => item.active !== false).length;

    const clicks =
        items.reduce(
            (sum, item) => sum + Number(item.clicks || 0),
            0
        );

    document.getElementById('totalGroups').textContent =
        formatNumber(groups.size);

    document.getElementById('activeProducts').textContent =
        formatNumber(activeCount);

    document.getElementById('totalClicks').textContent =
        formatNumber(clicks);
}

/* ========================================
   그룹 목록 및 검색
======================================== */

function renderLists() {
    const listDiv = document.getElementById('admin-list');
    const analyticsDiv =
        document.getElementById('analytics-list');

    const keyword =
        document.getElementById('searchInput')
            .value.trim().toLowerCase();

    listDiv.replaceChildren();
    analyticsDiv.replaceChildren();

    const groups = new Map();
    const items = [];

    Object.entries(allProductsData).forEach(([id, item]) => {
        if (!item) return;

        const record = {
            ...item,
            id
        };

        items.push(record);

        const name = item.group || '기타';

        if (!groups.has(name)) {
            groups.set(name, []);
        }

        groups.get(name).push(record);
    });

    let visibleGroups = 0;

    
[...groups.entries()]
    .sort((a, b) => {

        const getCreatedAt = (items) => {
            const times = items.map(item => {
                if (Number.isFinite(Number(item.createdAt)) &&
                    Number(item.createdAt) > 0) {
                    return Number(item.createdAt);
                }

                // 과거 상품은 Firebase push ID를 기준으로 처리
                return item.id || '';
            });

            const numericTimes = times.filter(
                value => typeof value === 'number'
            );

            return numericTimes.length
                ? Math.min(...numericTimes)
                : 0;
        };

        return getCreatedAt(b[1]) - getCreatedAt(a[1]);
    })
    .forEach(([groupName, groupItems]) => {


            const matched =
                groupName.toLowerCase().includes(keyword) ||
                groupItems.some(item =>
                    String(item.title || '')
                        .toLowerCase().includes(keyword)
                );

            if (!matched) return;

            visibleGroups++;

            const first = groupItems[0];
            const activeCount = groupItems.filter(item =>
                item.active !== false
            ).length;

            const div = document.createElement('div');
            div.className = 'admin-item';

            const info = document.createElement('div');
            info.className = 'admin-item-info';

            const img = document.createElement('img');
            img.className = 'admin-thumb';
            img.alt = '상품 썸네일';

            if (safeImage(first.image)) {
                img.src = first.image;
            }

            const textBox = document.createElement('div');

            const name = document.createElement('div');
            name.className = 'item-name';
            name.textContent = '📁 ' + groupName;

            const meta = document.createElement('div');
            meta.className = 'item-meta';
            meta.textContent =
                '상품 ' + groupItems.length +
                '개 · 게시 ' + activeCount + '개';

            textBox.appendChild(name);
            textBox.appendChild(meta);

            info.appendChild(img);
            info.appendChild(textBox);

            const actions = document.createElement('div');
            actions.className = 'admin-btn-group';

            const editBtn = document.createElement('button');
            editBtn.className = 'btn-edit';
            editBtn.textContent = '그룹 수정';
            editBtn.onclick = () => editGroup(groupName);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-del';
            deleteBtn.textContent = '그룹 삭제';
            deleteBtn.onclick = () => deleteGroup(groupName);

            actions.appendChild(editBtn);
            actions.appendChild(deleteBtn);

            div.appendChild(info);
            div.appendChild(actions);
            listDiv.appendChild(div);
        }
    );

    if (!visibleGroups) {
        listDiv.innerHTML =
            '<div class="empty-text">검색된 그룹이 없습니다.</div>';
    }

    /* 클릭 순위 */
    items.sort((a, b) =>
        Number(b.clicks || 0) - Number(a.clicks || 0)
    );

    items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'analytics-item';

        const info = document.createElement('div');
        info.className = 'admin-item-info';

        const img = document.createElement('img');
        img.className = 'admin-thumb';
        img.alt = '상품 이미지';

        if (safeImage(item.image)) {
            img.src = item.image;
        }

        const textBox = document.createElement('div');

        const name = document.createElement('div');
        name.className = 'item-name';
        name.textContent =
            (index + 1) + '위 · ' + (item.title || '상품명 없음');

        const group = document.createElement('div');
        group.className = 'item-meta';
        group.textContent = item.group || '';

        textBox.appendChild(name);
        textBox.appendChild(group);

        info.appendChild(img);
        info.appendChild(textBox);

        const count = document.createElement('span');
        count.className = 'click-count';
        count.textContent =
            '🖱️ ' + formatNumber(item.clicks) + '회';

        div.appendChild(info);
        div.appendChild(count);

        analyticsDiv.appendChild(div);
    });

    if (!items.length) {
        analyticsDiv.innerHTML =
            '<div class="empty-text">클릭 통계가 없습니다.</div>';
    }
}

/* ========================================
   기존 Firebase 상품 이미지 최적화 도구
======================================== */

let imageOptimizePlan = [];
let imageBackupReady = false;
let imageOptimizeRunning = false;

function setupImageOptimizer() {
    const manageTab = document.getElementById('tab-manage');
    if (!manageTab || document.getElementById('imageOptimizer')) {
        return;
    }

    const panel = document.createElement('div');
    panel.id = 'imageOptimizer';

    panel.style.cssText = `
        margin-top:30px;
        padding:18px;
        background:#fff8fa;
        border:1px solid #f0dce3;
        border-radius:16px;
    `;

    panel.innerHTML = `
        <h3>🖼️ 이미지 최적화 관리</h3>

        <p style="font-size:12px;color:#777;line-height:1.8;">
            기존 상품 이미지를 분석한 후
            백업과 압축을 진행합니다.
            JPG, PNG, WebP 이미지만 최적화합니다.
        </p>

        <div id="imageOptimizeStatus"
             style="margin:15px 0;padding:13px;
             background:white;border-radius:10px;
             font-size:12px;line-height:1.9;">
            아직 분석하지 않았습니다.
        </div>

        <button id="btnAnalyzeImages"
                type="button"
                class="btn-add-row">
            ① 기존 이미지 분석하기
        </button>

        <button id="btnBackupImages"
                type="button"
                class="btn-add-row"
                disabled>
            ② 원본 이미지 백업하기
        </button>

        <button id="btnRunOptimization"
                type="button"
                class="btn-action"
                disabled>
            ③ 압축 적용하기
        </button>
    `;

    manageTab.appendChild(panel);

    document.getElementById('btnAnalyzeImages')
        .addEventListener('click', analyzeExistingImages);

    document.getElementById('btnBackupImages')
        .addEventListener('click', backupExistingImages);

    document.getElementById('btnRunOptimization')
        .addEventListener('click', runImageOptimization);
}

function setOptimizeStatus(message) {
    const element = document.getElementById('imageOptimizeStatus');
    if (element) {
        element.textContent = message;
    }
}

function lockImageOptimizeButtons(locked) {
    imageOptimizeRunning = locked;

    document.getElementById('btnAnalyzeImages').disabled = locked;
    document.getElementById('btnBackupImages').disabled =
        locked || !imageOptimizePlan.length;

    document.getElementById('btnRunOptimization').disabled =
        locked || !imageBackupReady || !imageOptimizePlan.length;
}

/* ① 이미지 분석 - DB 변경 없음 */
async function analyzeExistingImages() {
    if (imageOptimizeRunning) return;

    imageOptimizePlan = [];
    imageBackupReady = false;
    lockImageOptimizeButtons(true);

    let totalBytes = 0;
    let optimizedBytes = 0;
    let failed = 0;
    let skipped = 0;

    try {
        // 분석 직전 서버의 최신 데이터를 읽음
        const snapshot = await db.ref('products').once('value');
        const products = snapshot.val() || {};

        const entries = Object.entries(products);

        for (let i = 0; i < entries.length; i++) {
            const [id, item] = entries[i];

            setOptimizeStatus(
                `이미지 분석 중... ${i + 1}/${entries.length}`
            );

            const source = item?.image;

            if (!source || typeof source !== 'string') {
                skipped++;
                continue;
            }

            if (!/^data:image\/(jpeg|png|webp);base64,/i.test(source)) {
                skipped++;
                continue;
            }

            try {
                const result = await compressImageDataURL(source);

                totalBytes += result.originalBytes;
                optimizedBytes += result.compressedBytes;

                if (result.compressedBytes < result.originalBytes) {
                    imageOptimizePlan.push({
                        id,
                        original: source,
                        compressed: result.dataURL,
                        before: result.originalBytes,
                        after: result.compressedBytes
                    });
                }
            } catch (error) {
                failed++;
                console.warn('이미지 분석 실패:', id, error);
            }

            // 긴 분석 중 브라우저 화면 갱신 기회 제공
            if (i % 5 === 0) {
                await new Promise(resolve => setTimeout(resolve, 0));
            }
        }

        const saved = Math.max(0, totalBytes - optimizedBytes);
        const percent = totalBytes
            ? (saved / totalBytes * 100).toFixed(1)
            : '0.0';

        setOptimizeStatus(
            `분석 완료\n` +
            `압축 대상: ${imageOptimizePlan.length}개\n` +
            `분석한 이미지 용량: ${formatKB(totalBytes)}\n` +
            `압축 후 예상 용량: ${formatKB(optimizedBytes)}\n` +
            `예상 절약: ${formatKB(saved)} (${percent}%)\n` +
            `분석 실패: ${failed}개 / 제외: ${skipped}개\n\n` +
            `원본 이미지를 백업한 뒤 적용할 수 있습니다.`
        );

    } catch (error) {
        imageOptimizePlan = [];
        setOptimizeStatus('분석 실패: ' + error.message);
    } finally {
        lockImageOptimizeButtons(false);
    }
}

/* ② 원본 백업 - JSON 다운로드 */
function backupExistingImages() {
    if (imageOptimizeRunning || !imageOptimizePlan.length) return;

    imageBackupReady = false;

    const backup = {
        version: 1,
        exportedAt: new Date().toISOString(),
        description: 'FreeStyle 상품 이미지 원본 백업',
        products: {}
    };

    imageOptimizePlan.forEach(item => {
        backup.products[item.id] = {
            image: item.original
        };
    });

    const blob = new Blob(
        [JSON.stringify(backup)],
        { type: 'application/json;charset=utf-8' }
    );

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');

    a.href = url;
    a.download =
        'freestyle_image_backup_' +
        new Date().toISOString().slice(0, 10) +
        '.json';

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(url), 60000);

    // 다운로드 시작만 확인 가능함.
    // 실제 파일 저장 여부는 사용자가 확인해야 함.
    const confirmed = confirm(
        '백업 파일 다운로드를 시작했습니다.\n\n' +
        '다운로드 폴더에서 JSON 파일이 실제로 저장되었는지 ' +
        '확인하셨나요?\n\n' +
        '확인한 경우에만 [확인]을 누르세요.'
    );

    imageBackupReady = confirmed;
    lockImageOptimizeButtons(false);

    setOptimizeStatus(
        confirmed
        ? '백업 파일 확인 완료. 이제 최적화를 실행할 수 있습니다.'
        : '백업 파일을 확인한 후 다시 백업 버튼을 눌러주세요.'
    );
}

/* ③ 최적화 적용 */
async function runImageOptimization() {
    if (imageOptimizeRunning ||
        !imageBackupReady ||
        !imageOptimizePlan.length) return;

    const confirmed = confirm(
        `${imageOptimizePlan.length}개 상품 이미지를 압축합니다.\n\n` +
        '기존 이미지가 Firebase에서 교체됩니다.\n' +
        '일부 이미지의 화질이나 투명 배경이 변경될 수 있습니다.\n\n' +
        '백업을 확인했고 적용을 진행하시겠습니까?'
    );

    if (!confirmed) return;

    lockImageOptimizeButtons(true);

    let success = 0;
    let skipped = 0;
    let failed = 0;

    try {
        for (let i = 0; i < imageOptimizePlan.length; i++) {
            const item = imageOptimizePlan[i];

            setOptimizeStatus(
                `최적화 적용 중...\n` +
                `${i + 1}/${imageOptimizePlan.length}\n` +
                `성공 ${success} / 건너뜀 ${skipped} / 실패 ${failed}`
            );

            try {
                // 분석 후 이미지가 변경됐다면 덮어쓰지 않음
                const result = await db.ref(
                    'products/' + item.id + '/image'
                ).transaction(current => {
                    if (current !== item.original) {
                        return;
                    }
                    return item.compressed;
                }, undefined, false);

                if (result.committed) {
                    success++;
                } else {
                    skipped++;
                }
            } catch (error) {
                failed++;
                console.error('이미지 교체 실패:', item.id, error);
            }
        }

        setOptimizeStatus(
            `최적화 작업 종료\n` +
            `성공: ${success}개\n` +
            `건너뜀: ${skipped}개\n` +
            `실패: ${failed}개\n\n` +
            `브라우저를 새로고침한 뒤 속도를 비교해 보세요.`
        );

        alert(
            `이미지 최적화 완료\n` +
            `성공 ${success}개 / 실패 ${failed}개`
        );
    } finally {
        imageOptimizePlan = [];
        imageBackupReady = false;
        lockImageOptimizeButtons(false);
    }
}

/* 관리자 페이지 로딩 시 버튼 생성 */
if (document.readyState === 'loading') {
    document.addEventListener(
        'DOMContentLoaded',
        setupImageOptimizer
    );
} else {
    setupImageOptimizer();
}

<script>
/* ===========================================
   FreeStyle 관리자 목록 확장
   1. 실제 고객 페이지 목록 미리보기
   2. 최초 등록 기준 최신순 표시
=========================================== */

(function () {
    const PAGE_SIZE = 10;
    let visibleGroups = PAGE_SIZE;

    function getPushTime(id) {
        const chars =
            '-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';

        if (!id || id.length < 20) return 0;

        let time = 0;

        for (let i = 0; i < 8; i++) {
            const n = chars.indexOf(id[i]);
            if (n < 0) return 0;
            time = time * 64 + n;
        }

        return Number.isSafeInteger(time) ? time : 0;
    }

    function getGroups() {
        const groups = new Map();

        Object.entries(allProductsData || {}).forEach(
            ([id, item]) => {
                if (!item || !item.group) return;

                if (!groups.has(item.group)) {
                    groups.set(item.group, {
                        name: item.group,
                        items: [],
                        createdAt: Infinity,
                        firstKey: id
                    });
                }

                const group = groups.get(item.group);

                const time =
                    Number(item.groupCreatedAt) ||
                    Number(item.createdAt) ||
                    getPushTime(id);

                if (time > 0) {
                    group.createdAt =
                        Math.min(group.createdAt, time);
                }

                if (id < group.firstKey) {
                    group.firstKey = id;
                }

                if (item.active !== false) {
                    group.items.push({ ...item, id });
                }
            }
        );

        return [...groups.values()]
            .filter(g => g.items.length > 0)
            .map(g => {
                g.items.sort((a, b) =>
                    (Number(a.order) || 0) -
                    (Number(b.order) || 0)
                );

                if (!Number.isFinite(g.createdAt)) {
                    g.createdAt = 0;
                }

                return g;
            })
            .sort((a, b) =>
                b.createdAt - a.createdAt ||
                b.firstKey.localeCompare(a.firstKey)
            );
    }

    function createPanel() {
        const pane = document.querySelector('.preview-pane');
        if (!pane) return null;

        let panel = document.getElementById(
            'customerLivePanel'
        );

        if (panel) return panel;

        panel = document.createElement('div');
        panel.id = 'customerLivePanel';
        panel.className = 'customer-list-panel';

        panel.innerHTML = `
            <div class="customer-list-heading">
                <strong>🛍️ 고객 페이지 실제 목록</strong>
                <span class="customer-list-count"
                      id="customerGroupCount"></span>
            </div>

            <div class="customer-list-scroll"
                 id="customerLiveList"></div>

            <button type="button"
                    id="customerMoreBtn"
                    class="customer-list-more"
                    hidden>
                이전 그룹 더 보기 ↓
            </button>
        `;

        pane.appendChild(panel);

        panel.querySelector('#customerMoreBtn')
            .addEventListener('click', () => {
                visibleGroups += PAGE_SIZE;
                renderCustomerPreview();
            });

        return panel;
    }

    function renderCustomerPreview() {
        const panel = createPanel();
        if (!panel) return;

        const list = document.getElementById(
            'customerLiveList'
        );

        const groups = getGroups();
        const visible = groups.slice(0, visibleGroups);

        document.getElementById(
            'customerGroupCount'
        ).textContent = `${groups.length}개 그룹`;

        list.replaceChildren();

        if (!groups.length) {
            const empty = document.createElement('div');
            empty.className = 'customer-list-empty';
            empty.textContent = '게시된 상품이 없습니다.';
            list.appendChild(empty);
        }

        visible.forEach(group => {
            const box = document.createElement('div');
            box.className = 'customer-group';

            const title = document.createElement('div');
            title.className = 'customer-group-title';
            title.textContent = group.name;

            const color = group.items[0]?.groupColor;

            if (/^#[0-9a-f]{6}$/i.test(color || '')) {
                title.style.color = color;
            }

            box.appendChild(title);

            group.items.forEach(item => {
                const card = document.createElement('a');
                card.className = 'customer-product';

                // 미리보기에서는 클릭 통계를 기록하지 않음
                let safeUrl = '';

                try {
                    const url = new URL(item.link);

                    if (url.protocol === 'https:' ||
                        url.protocol === 'http:') {
                        safeUrl = url.href;
                    }
                } catch (e) {}

                if (safeUrl) {
                    card.href = safeUrl;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                }

                const image = document.createElement('img');
                image.alt = '상품 이미지';
                image.loading = 'lazy';

                if (typeof item.image === 'string' &&
                    (/^https:\/\//i.test(item.image) ||
                     /^data:image\/(png|jpeg|webp|gif);base64,/i
                        .test(item.image))) {
                    image.src = item.image;
                }

                const name = document.createElement('span');
                name.textContent = item.title || '상품명 없음';

                const textColor = item.productTextColor;

                if (/^#[0-9a-f]{6}$/i.test(textColor || '') &&
                    textColor.toLowerCase() !== '#ffffff') {
                    name.style.color = textColor;
                }

                card.appendChild(image);
                card.appendChild(name);
                box.appendChild(card);
            });

            list.appendChild(box);
        });

        const more = document.getElementById(
            'customerMoreBtn'
        );

        const remaining = groups.length - visible.length;

        more.hidden = remaining <= 0;

        if (remaining > 0) {
            more.textContent =
                `이전 그룹 더 보기 ↓ (${remaining}개 남음)`;
        }
    }

    /* 등록된 그룹 목록 최신순 정렬 */
    function sortAdminGroupList() {
        const list = document.getElementById('admin-list');
        if (!list) return;

        const groups = getGroups();

        // 게시 중지 그룹도 관리자 목록에서 정렬
        const orderMap = new Map(
            groups.map((g, i) => [g.name, i])
        );

        const allGroupTimes = new Map();

        Object.entries(allProductsData || {}).forEach(
            ([id, item]) => {
                if (!item?.group) return;

                const time =
                    Number(item.groupCreatedAt) ||
                    Number(item.createdAt) ||
                    getPushTime(id);

                const old = allGroupTimes.get(item.group);

                if (old === undefined || time < old) {
                    allGroupTimes.set(item.group, time);
                }
            }
        );

        const rows = [...list.children].filter(
            el => el.classList.contains('admin-item')
        );

        const getGroupName = row => {
            const el = row.querySelector(
                '.admin-item-info .item-name, ' +
                '.admin-item-info strong'
            );

            return (el?.textContent || '')
                .replace(/^[📁📂\s]+/u, '')
                .trim();
        };

        rows.sort((a, b) => {
            const nameA = getGroupName(a);
            const nameB = getGroupName(b);

            const timeA = allGroupTimes.get(nameA) || 0;
            const timeB = allGroupTimes.get(nameB) || 0;

            return timeB - timeA;
        });

        rows.forEach(row => list.appendChild(row));
    }

    function refreshExtraViews() {
        renderCustomerPreview();
        sortAdminGroupList();
    }

    // 기존 renderLists 이후 추가 뷰 갱신
    if (typeof renderLists === 'function') {
        const originalRenderLists = renderLists;

        renderLists = function (...args) {
            const result = originalRenderLists.apply(this, args);
            refreshExtraViews();
            return result;
        };
    }

    // Firebase 수신 이후에도 최신 데이터 반영
    if (typeof db !== 'undefined') {
        db.ref('products').on('value', () => {
            // 기존 데이터 리스너가 먼저 실행되도록 지연
            setTimeout(refreshExtraViews, 0);
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener(
            'DOMContentLoaded',
            refreshExtraViews
        );
    } else {
        refreshExtraViews();
    }
})();
</script>

<script>
/* ==========================================
   FreeStyle 실제 고객 페이지 편집 미리보기

   - 고객용 index.html을 그대로 표시
   - 내부 스크롤 / 검색 / 더 보기 가능
   - 그룹 클릭 -> 그룹 수정
   - 상품 클릭 -> 해당 상품 입력창 선택
   - 선택 그룹에 상품 추가
========================================== */

(function () {
    const pane = document.querySelector('.preview-pane');

    if (!pane) {
        console.warn('미리보기 패널을 찾지 못했습니다.');
        return;
    }

    const draftPreview =
        document.getElementById('livePreviewScreen');

    const tabs = document.createElement('div');
    tabs.className = 'live-editor-tabs';

    tabs.innerHTML = `
        <button type="button" id="liveModeBtn"
                class="selected">실제 고객 화면</button>
        <button type="button" id="draftModeBtn">
                작성 중 미리보기</button>
    `;

    const frame = document.createElement('iframe');
    frame.className = 'live-customer-frame';
    frame.title = '고객용 상품 페이지 편집 미리보기';
    frame.src = './index.html';

    const bar = document.createElement('div');
    bar.className = 'live-selection-bar';

    bar.innerHTML = `
        <div id="liveSelectedName"
             class="live-selection-name">
            왼쪽에서 그룹이나 상품을 선택하세요.
        </div>

        <div class="live-editor-actions">
            <button type="button" id="liveAddGroup">
                + 새 그룹
            </button>

            <button type="button" id="liveAddProduct"
                    disabled>
                + 선택 그룹에 상품 추가
            </button>
        </div>
    `;

    // 기존 작성 미리보기를 유지한 채 삽입
    if (draftPreview) {
        pane.insertBefore(tabs, draftPreview);
        draftPreview.classList.add('live-hidden');
        draftPreview.style.flex = '1';
        draftPreview.style.minHeight = '0';
    } else {
        pane.prepend(tabs);
    }

    tabs.insertAdjacentElement('afterend', frame);
    frame.insertAdjacentElement('afterend', bar);

    const liveBtn = document.getElementById('liveModeBtn');
    const draftBtn = document.getElementById('draftModeBtn');

    let selectedGroupName = '';

    function setMode(mode) {
        const live = mode === 'live';

        frame.style.display = live ? 'block' : 'none';
        bar.style.display = live ? 'flex' : 'none';

        if (draftPreview) {
            draftPreview.classList.toggle(
                'live-hidden', live
            );
        }

        liveBtn.classList.toggle('selected', live);
        draftBtn.classList.toggle('selected', !live);
    }

    liveBtn.addEventListener('click', () => {
        setMode('live');
    });

    draftBtn.addEventListener('click', () => {
        setMode('draft');
    });

    function cleanGroupName(text) {
        return String(text || '')
            .replace(/^[\s✦📂📁]+/u, '')
            .trim();
    }

    function highlightSelection(element) {
        const doc = frame.contentDocument;
        if (!doc) return;

        doc.querySelectorAll('.admin-preview-selected')
            .forEach(el => {
                el.classList.remove('admin-preview-selected');
                el.style.outline = '';
                el.style.outlineOffset = '';
            });

        if (element) {
            element.classList.add('admin-preview-selected');
            element.style.outline = '2px solid #ed7295';
            element.style.outlineOffset = '2px';
        }
    }

    function openGroupEditor(groupName, productTitle = '') {
        if (!groupName) return;

        if (typeof editGroup !== 'function') {
            alert('그룹 수정 기능을 찾지 못했습니다.');
            return;
        }

        // 존재하는 그룹인지 먼저 확인
        const exists = Object.values(
            typeof allProductsData !== 'undefined'
                ? allProductsData : {}
        ).some(item => item && item.group === groupName);

        if (!exists) {
            alert('등록된 그룹을 찾지 못했습니다.');
            return;
        }

        selectedGroupName = groupName;

        document.getElementById('liveSelectedName')
            .textContent = productTitle
                ? groupName + ' / ' + productTitle
                : groupName;

        document.getElementById('liveAddProduct')
            .disabled = false;

        if (typeof switchTab === 'function') {
            switchTab('manage');
        }

        // 기존 그룹 수정 기능 그대로 사용
        editGroup(groupName);

        // 실제 선택한 상품 입력창에 포커스
        if (productTitle) {
            const rows = [
                ...document.querySelectorAll(
                    '#productRowsContainer .product-input-card'
                )
            ];

            const row = rows.find(card =>
                card.querySelector('.row-title')?.value.trim()
                    === productTitle.trim()
            );

            if (row) {
                row.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });

                row.querySelector('.row-title')?.focus({
                    preventScroll: true
                });
            }
        }
    }

    function handleCustomerClick(event) {
        const target = event.target;

        if (!(target instanceof frame.contentWindow.Element)) {
            return;
        }

        const itemCard = target.closest('.item-card');
        const groupTitle = target.closest('.group-title');

        if (!itemCard && !groupTitle) {
            // 검색창 및 더 보기 버튼은 정상 작동
            return;
        }

        const group = target.closest('.group-container');
        if (!group) return;

        const heading = group.querySelector('.group-title');
        if (!heading) return;

        const groupName = cleanGroupName(heading.textContent);

        // 고객 상품 링크 이동을 방지
        // 관리자 미리보기의 클릭은 편집 동작으로 전환
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();

        if (itemCard) {
            const productTitle =
                itemCard.querySelector('.item-title')
                    ?.textContent.trim() || '';

            highlightSelection(itemCard);
            openGroupEditor(groupName, productTitle);
        } else {
            highlightSelection(groupTitle);
            openGroupEditor(groupName);
        }
    }

    frame.addEventListener('load', () => {
        try {
            const doc = frame.contentDocument;

            if (!doc) return;

            // 캡처 단계에서 클릭을 먼저 처리하여
            // 상품 링크 이동과 클릭 통계 증가를 막음
            doc.addEventListener(
                'click',
                handleCustomerClick,
                true
            );

            // 그룹 제목을 클릭할 수 있게 표시
            const style = doc.createElement('style');
            style.textContent = `
                .group-title,
                .item-card {
                    cursor: pointer !important;
                }

                .group-title:hover {
                    background: #fff0f4;
                    border-radius: 5px;
                }

                .item-card:hover {
                    outline: 1px solid #ed7295;
                }
            `;
            doc.head.appendChild(style);

        } catch (error) {
            console.error('미리보기 연결 실패:', error);
            document.getElementById('liveSelectedName')
                .textContent =
                    '고객 페이지와 관리자 페이지의 주소를 확인하세요.';
        }
    });

    // 신규 그룹
    document.getElementById('liveAddGroup')
        .addEventListener('click', () => {
            selectedGroupName = '';

            document.getElementById('liveSelectedName')
                .textContent = '새 그룹 작성 중';

            document.getElementById('liveAddProduct')
                .disabled = true;

            if (typeof switchTab === 'function') {
                switchTab('manage');
            }

            if (typeof resetFormMode === 'function') {
                resetFormMode();
            }

            document.getElementById('groupTitleInput')
                ?.focus();
        });

    // 선택한 기존 그룹에 상품 추가
    document.getElementById('liveAddProduct')
        .addEventListener('click', () => {
            if (!selectedGroupName) return;

            if (typeof addProductRow !== 'function') {
                alert('상품 추가 기능을 찾지 못했습니다.');
                return;
            }

            // 다른 그룹이 편집 중이라면 선택 그룹을 열기
            const editingName =
                document.getElementById('editingGroupName')
                    ?.value.trim();

            if (editingName !== selectedGroupName) {
                openGroupEditor(selectedGroupName);
            }

            addProductRow();

            const rows = document.querySelectorAll(
                '#productRowsContainer .product-input-card'
            );

            const last = rows[rows.length - 1];

            if (last) {
                last.scrollIntoView({
                    behavior: 'smooth',
                    block: 'center'
                });

                last.querySelector('.row-title')?.focus({
                    preventScroll: true
                });
            }
        });

    setMode('live');
})();
</script>
