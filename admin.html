
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeStyle 상품 관리</title>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
:root {
    --pink: #ed7295;
    --pink-dark: #d85178;
    --pink-light: #fff0f4;
    --bg: #f9f4f6;
    --white: #ffffff;
    --text: #302d36;
    --muted: #8c8490;
    --line: #eee4e9;
    --shadow: 0 8px 28px rgba(72,45,62,.06);
}

* {
    box-sizing: border-box;
    font-family: 'Pretendard','Apple SD Gothic Neo',
                 'Malgun Gothic',sans-serif;
}

body {
    margin: 0;
    padding: 30px 20px;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
}

.admin-wrapper {
    max-width: 1250px;
    margin: auto;
    display: grid;
    grid-template-columns: 300px minmax(0,1fr);
    gap: 25px;
    align-items: start;
}

/* 모바일 미리보기 */
.preview-pane {
    position: sticky;
    top: 24px;
    padding: 12px;
    border: 5px solid #e8dee3;
    border-radius: 35px;
    background: white;
    box-shadow: var(--shadow);
}

.preview-label {
    padding: 5px 0 12px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
}

.preview-screen {
    height: 570px;
    overflow-y: auto;
    padding: 22px 13px;
    background: #fbf0f3;
    border-radius: 24px;
    scrollbar-width: thin;
}

.preview-profile {
    width: 70px;
    height: 70px;
    display: block;
    margin: 10px auto;
    border-radius: 50%;
    background: white;
    border: 3px solid white;
    object-fit: cover;
}

.preview-title {
    text-align: center;
    font-size: 16px;
    font-weight: 800;
}

.preview-subtitle {
    margin: 8px 0 25px;
    color: #91868d;
    font-size: 11px;
    text-align: center;
}

.preview-group-box {
    margin-top: 20px;
}

.preview-group-title {
    margin-bottom: 11px;
    padding-bottom: 10px;
    border-bottom: 1px solid #eadbe0;
    font-size: 12px;
    font-weight: 800;
}

.preview-items-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.preview-items-wrap.carousel {
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-bottom: 8px;
}

.preview-item-card {
    width: 100%;
    flex-shrink: 0;
    padding: 9px;
    border: 1px solid #f1e6e9;
    border-radius: 11px;
    background: white;
    text-align: center;
    overflow: hidden;
}

.preview-item-card.list {
    display: flex;
    align-items: center;
    gap: 9px;
    text-align: left;
}

.preview-item-card.col2 {
    width: calc(50% - 4px);
}

.preview-item-card.col3 {
    width: calc(33.333% - 6px);
}

.preview-item-card.carousel1 {
    width: 75%;
}

.preview-item-card.carousel2 {
    width: 50%;
}

.preview-item-img {
    width: 100%;
    height: 65px;
    border-radius: 7px;
    object-fit: cover;
    background: #f4edf0;
}

.preview-item-card.list .preview-item-img {
    width: 45px;
    height: 45px;
    flex-shrink: 0;
}

.preview-item-text {
    margin-top: 5px;
    font-size: 10px;
    font-weight: 700;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.preview-item-card.list .preview-item-text {
    margin: 0;
}

/* 관리자 패널 */
.admin-box {
    min-width: 0;
    padding: 30px;
    background: white;
    border: 1px solid #f0e7eb;
    border-radius: 24px;
    box-shadow: var(--shadow);
}

.top-title {
    margin: 0 0 7px;
    font-size: 25px;
    letter-spacing: -.8px;
}

.top-desc {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
}

/* 요약 통계 */
.summary-grid {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 11px;
    margin-bottom: 26px;
}

.summary-card {
    padding: 17px;
    background: #fff8fa;
    border: 1px solid #f6e4ea;
    border-radius: 15px;
}

.summary-label {
    color: var(--muted);
    font-size: 12px;
}

.summary-value {
    margin-top: 8px;
    font-size: 25px;
    font-weight: 800;
    color: var(--pink-dark);
}

/* 탭 */
.tab-menu {
    display: flex;
    gap: 8px;
    padding: 6px;
    margin-bottom: 28px;
    border-radius: 13px;
    background: #f8f5f7;
}

.tab-btn {
    flex: 1;
    min-width: 0;
    padding: 13px 6px;
    background: transparent;
    border: 0;
    border-radius: 10px;
    color: #837a84;
    font-size: 13px;
    font-weight: 700;
}

.tab-btn.active {
    background: var(--pink);
    color: white;
    box-shadow: 0 3px 12px rgba(237,114,149,.20);
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

h3 {
    margin: 18px 0;
    font-size: 18px;
}

label.field-label {
    display: block;
    margin: 17px 0 8px;
    color: #655c65;
    font-size: 13px;
    font-weight: 700;
}

input[type=text],
input[type=url],
input[type=search] {
    width: 100%;
    min-width: 0;
    padding: 12px 13px;
    border: 1px solid #e7dfe4;
    border-radius: 10px;
    background: #fcfafb;
    color: var(--text);
    outline: none;
    font-size: 13px;
}

input:focus {
    border-color: var(--pink);
}

input::placeholder {
    color: #aaa0a9;
}

.group-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

.group-title-row > input {
    flex: 1;
}

.inline-color-picker {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    padding: 7px 9px;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--muted);
    font-size: 11px;
}

input[type=color] {
    width: 28px;
    height: 28px;
    border: 0;
    background: transparent;
    cursor: pointer;
}

/* 레이아웃 */
.layout-selector {
    display: grid;
    grid-template-columns: repeat(5,minmax(0,1fr));
    gap: 8px;
}

.layout-option {
    padding: 13px 5px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fcfafb;
    color: #716a73;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
}

.layout-option input {
    display: none;
}

.layout-option.selected {
    border-color: var(--pink);
    background: var(--pink-light);
    color: var(--pink-dark);
}

/* 상품 입력 */
.product-input-card {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: white;
}

.product-input-card.dragging {
    opacity: .45;
    background: #fff0f4;
}

.drag-handle {
    cursor: grab;
    color: #aaa0a9;
    font-size: 20px;
    user-select: none;
}

.image-box {
    position: relative;
    flex-shrink: 0;
}

.image-drop-zone {
    position: relative;
    width: 76px;
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px dashed #e8bccc;
    border-radius: 10px;
    background: #fff8fa;
    overflow: hidden;
    cursor: pointer;
}

.image-drop-zone.dragover {
    border-color: var(--pink);
    background: #ffe8ee;
}

.plus-icon {
    font-size: 24px;
    color: var(--pink);
}

.image-drop-zone img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.btn-delete-img {
    position: absolute;
    right: -5px;
    bottom: -5px;
    width: 24px;
    height: 24px;
    border: 0;
    border-radius: 50%;
    background: var(--pink);
    color: white;
    font-size: 12px;
}

.card-fields {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.title-input-row {
    display: flex;
    align-items: center;
    gap: 7px;
}

.title-input-row > input {
    flex: 1;
}

.card-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;
    height: 76px;
}

.switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 22px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    background: #d4ccd2;
    cursor: pointer;
}

.slider:before {
    content: "";
    position: absolute;
    left: 3px;
    top: 3px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: white;
    transition: .2s;
}

.switch input:checked + .slider {
    background: var(--pink);
}

.switch input:checked + .slider:before {
    transform: translateX(18px);
}

.btn-row-delete {
    border: none;
    background: transparent;
    font-size: 19px;
}

.btn-add-row {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: 1px dashed #e9afc0;
    border-radius: 11px;
    background: #fff0f4;
    color: var(--pink-dark);
    font-weight: 800;
}

.btn-action,
.btn-profile {
    width: 100%;
    margin-top: 17px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: var(--pink);
    color: white;
    font-size: 14px;
    font-weight: 800;
}

.btn-action:hover,
.btn-profile:hover {
    background: var(--pink-dark);
}

.btn-action:disabled {
    opacity: .55;
    cursor: not-allowed;
}

.btn-cancel {
    background: #aaa3ad;
}

.divider {
    margin: 30px 0;
    border: none;
    border-top: 1px solid var(--line);
}

/* 등록 그룹 */
.search-input {
    margin-bottom: 15px;
}

.item-list,
.analytics-section {
    max-height: 480px;
    overflow-y: auto;
}

.admin-item,
.analytics-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px;
    margin-bottom: 9px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: white;
}

.admin-item-info {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
    flex: 1;
}

.admin-thumb {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 9px;
    object-fit: cover;
    background: #f0edf0;
}

.item-name {
    min-width: 0;
    overflow-wrap: anywhere;
    font-size: 13px;
    font-weight: 700;
}

.item-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 11px;
}

.admin-btn-group {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
}

.btn-edit,
.btn-del {
    padding: 9px 11px;
    border: none;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
}

.btn-edit {
    background: #eaf6ee;
    color: #268953;
}

.btn-del {
    background: #fff0f2;
    color: #d85b75;
}

.click-count {
    flex-shrink: 0;
    padding: 6px 10px;
    border-radius: 20px;
    background: var(--pink-light);
    color: var(--pink-dark);
    font-size: 12px;
    font-weight: 800;
}

.profile-preview-box {
    margin: 20px 0;
    text-align: center;
}

.current-profile-img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    background: #f0edf0;
}

.file-box {
    padding: 13px;
    border: 1px dashed #e8c4cf;
    border-radius: 12px;
    background: #fffafb;
}

.help-text {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
}

.empty-text {
    padding: 25px;
    color: var(--muted);
    text-align: center;
    font-size: 13px;
}

@media(max-width:900px) {
    .admin-wrapper {
        grid-template-columns: 1fr;
    }

    .preview-pane {
        position: static;
        max-width: 370px;
        width: 100%;
        margin: auto;
    }
}

@media(max-width:540px) {
    body {
        padding: 12px;
    }

    .admin-box {
        padding: 18px 13px;
    }

    .top-title {
        font-size: 21px;
    }

    .summary-card {
        padding: 12px 8px;
    }

    .summary-value {
        font-size: 20px;
    }

    .tab-btn {
        font-size: 11px;
        padding: 11px 3px;
    }

    .layout-selector {
        grid-template-columns: repeat(3,1fr);
    }

    .product-input-card {
        gap: 7px;
        padding: 10px;
    }

    .image-drop-zone {
        width: 55px;
        height: 60px;
    }

    .card-fields input {
        font-size: 11px;
        padding: 9px 7px;
    }

    .title-input-row .inline-color-picker {
        font-size: 0;
        padding: 4px;
    }

    .admin-item {
        flex-wrap: wrap;
    }

    .admin-btn-group {
        margin-left: auto;
    }
}
</style>
</head>

<body>

<div class="admin-wrapper">

    <!-- 모바일 미리보기 -->
    <aside class="preview-pane">
        <div class="preview-label">LIVE PREVIEW</div>

        <div class="preview-screen" id="livePreviewScreen">
            <img id="prevProfileImg"
                 class="preview-profile"
                 alt="프로필">

            <div class="preview-title">
                FreeStyle 꿀템 저장소
            </div>

            <div class="preview-subtitle">
                쇼츠 속 추천 꿀템을 만나보세요!
            </div>

            <div class="preview-group-box">
                <div class="preview-group-title"
                     id="prevGroupTitle">
                    대표 문구를 입력하세요
                </div>

                <div class="preview-items-wrap"
                     id="prevItemsWrap">
                </div>
            </div>
        </div>
    </aside>

    <!-- 관리자 패널 -->
    <main class="admin-box">

        <h1 class="top-title">FreeStyle 관리자</h1>
        <p class="top-desc">
            상품 등록부터 클릭 통계까지 한 곳에서 관리하세요.
        </p>

        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-label">전체 그룹</div>
                <div class="summary-value" id="totalGroups">0</div>
            </div>

            <div class="summary-card">
                <div class="summary-label">게시 상품</div>
                <div class="summary-value" id="activeProducts">0</div>
            </div>

            <div class="summary-card">
                <div class="summary-label">누적 클릭</div>
                <div class="summary-value" id="totalClicks">0</div>
            </div>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active"
                    data-tab="manage"
                    onclick="switchTab('manage')">
                📦 상품 관리
            </button>

            <button class="tab-btn"
                    data-tab="profile"
                    onclick="switchTab('profile')">
                ⚙️ 프로필
            </button>

            <button class="tab-btn"
                    data-tab="analytics"
                    onclick="switchTab('analytics')">
                📊 통계
            </button>
        </div>

        <!-- 상품 관리 -->
        <section id="tab-manage"
                 class="tab-content active">

            <h3 id="formModeTitle">➕ 그룹 상품 등록</h3>

            <input type="hidden"
                   id="editingGroupName">

            <label class="field-label">
                대표 문구 (그룹 제목)
            </label>

            <div class="group-title-row">
                <input type="text"
                       id="groupTitleInput"
                       placeholder="예: 싱크대 청소 추천템 TOP 3"
                       oninput="updateLivePreview()">

                <div class="inline-color-picker">
                    색상
                    <input type="color"
                           id="groupTextColor"
                           value="#ed7295"
                           onchange="updateLivePreview()">
                </div>
            </div>

            <label class="field-label">
                레이아웃 배치 선택
            </label>

            <div class="layout-selector" id="layoutSelector">
                <label class="layout-option selected"
                       id="layoutOpt_list"
                       onclick="setLayout('list')">
                    <input type="radio"
                           name="layoutType"
                           value="list" checked>
                    기본 배치
                </label>

                <label class="layout-option"
                       id="layoutOpt_col2"
                       onclick="setLayout('col2')">
                    <input type="radio"
                           name="layoutType"
                           value="col2">
                    2열 배치
                </label>

                <label class="layout-option"
                       id="layoutOpt_col3"
                       onclick="setLayout('col3')">
                    <input type="radio"
                           name="layoutType"
                           value="col3">
                    3열 배치
                </label>

                <label class="layout-option"
                       id="layoutOpt_carousel1"
                       onclick="setLayout('carousel1')">
                    <input type="radio"
                           name="layoutType"
                           value="carousel1">
                    1캐러셀
                </label>

                <label class="layout-option"
                       id="layoutOpt_carousel2"
                       onclick="setLayout('carousel2')">
                    <input type="radio"
                           name="layoutType"
                           value="carousel2">
                    2캐러셀
                </label>
            </div>

            <label class="field-label">
                상품 링크 목록
            </label>

            <div id="productRowsContainer"></div>

            <button class="btn-add-row"
                    onclick="addProductRow()">
                + 상품 추가
            </button>

            <button class="btn-action"
                    id="submitBtn"
                    onclick="saveGroupProducts()">
                🚀 그룹 상품 등록하기
            </button>

            <button class="btn-action btn-cancel"
                    id="cancelBtn"
                    onclick="resetFormMode()"
                    style="display:none;">
                수정 취소
            </button>

            <hr class="divider">

            <h3>📋 등록된 그룹 목록</h3>

            <input type="search"
                   id="searchInput"
                   class="search-input"
                   placeholder="그룹명 또는 상품명 검색..."
                   oninput="renderLists()">

            <div class="item-list" id="admin-list"></div>
        </section>

        <!-- 프로필 -->
        <section id="tab-profile"
                 class="tab-content">

            <h3>👤 프로필 설정</h3>

            <p class="help-text">
                고객 페이지 상단에 표시되는 프로필
                이미지를 변경할 수 있습니다.
            </p>

            <div class="profile-preview-box">
                <img id="currentProfileView"
                     class="current-profile-img"
                     alt="현재 프로필">
            </div>

            <label class="field-label">
                새 프로필 이미지
            </label>

            <div class="file-box">
                <input type="file"
                       id="profileFileInput"
                       accept="image/*">
            </div>

            <button class="btn-profile"
                    onclick="updateProfileImage()">
                💾 프로필 이미지 저장
            </button>
        </section>

        <!-- 통계 -->
        <section id="tab-analytics"
                 class="tab-content">

            <h3>📊 인기 상품 클릭 순위</h3>

            <p class="help-text">
                상품별 누적 클릭 횟수를 기준으로 정렬합니다.
            </p>

            <div class="analytics-section"
                 id="analytics-list">
            </div>
        </section>

    </main>
</div>

<script>
/* ========================================
   Firebase 설정
======================================== */

const firebaseConfig = {
    apiKey: "AIzaSyCMy4vdbdLd26v8l2kGTsCW-IZaGklqwLs",
    authDomain: "freestyle-db-becce.firebaseapp.com",
    projectId: "freestyle-db-becce",
    storageBucket: "freestyle-db-becce.firebasestorage.app",
    messagingSenderId: "811035384445",
    appId: "1:811035384445:web:490ffeb5f09cb763f0ef14",
    measurementId: "G-FY7T44KY7D"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let allProductsData = {};
let currentLayout = 'list';

/* ========================================
   유틸리티
======================================== */

function escapeHTML(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

function isSafeImageSource(value) {
    if (typeof value !== 'string') return false;

    return /^https:\/\//i.test(value) ||
        /^data:image\/(png|jpeg|jpg|webp|gif);base64,/i.test(value);
}

function safeImage(value) {
    return isSafeImageSource(value) ? value : '';
}

function formatNumber(value) {
    return Number(value || 0).toLocaleString('ko-KR');
}

function readFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
    });
}

======================================== */

function getDragAfterElement(container, y) {
    const elements = [
        ...container.querySelectorAll(
            '.product-input-card:not(.dragging)'
        )
    ];

    return elements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;

        if (offset < 0 && offset > closest.offset) {
            return {
                offset,
                element: child
            };
        }

        return closest;
    }, {
        offset: Number.NEGATIVE_INFINITY
    }).element;
}

document.getElementById('productRowsContainer')
    .addEventListener('dragover', event => {

        event.preventDefault();

        const container =
            document.getElementById('productRowsContainer');

        const dragging =
            container.querySelector('.dragging');

        if (!dragging) return;

        const after =
            getDragAfterElement(container, event.clientY);

        if (after) {
            container.insertBefore(dragging, after);
        } else {
            container.appendChild(dragging);
        }
    });

/* ========================================
   상품 저장
   기존 상품 ID와 클릭 수 보존
======================================== */

function getPushTime(id) {
    const chars =
        '-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';

    if (typeof id !== 'string' || id.length < 20) {
        return 0;
    }

    let time = 0;

    for (let i = 0; i < 8; i++) {
        const n = chars.indexOf(id[i]);
        if (n < 0) return 0;
        time = time * 64 + n;
    }

    return Number.isSafeInteger(time) ? time : 0;
}

function editGroup(groupName) {
    const groupItems =
        Object.entries(allProductsData)
            .filter(([id, item]) =>
                item.group === groupName
            )
            .map(([id, item]) => ({
                ...item,
                id
            }))
            .sort((a, b) =>
                (a.order || 0) - (b.order || 0)
            );

    if (!groupItems.length) {
        alert('그룹을 찾을 수 없습니다.');
        return;
    }

    switchTab('manage');

    document.getElementById('editingGroupName').value =
        groupName;

    document.getElementById('groupTitleInput').value =
        groupName;

    document.getElementById('formModeTitle').textContent =
        '✏️ 그룹 수정: ' + groupName;

    document.getElementById('submitBtn').textContent =
        '💾 수정 사항 저장하기';

    document.getElementById('cancelBtn').style.display =
        'block';

    document.getElementById('productRowsContainer')
        .replaceChildren();

    document.getElementById('groupTextColor').value =
        groupItems[0].groupColor || '#ed7295';

    setLayout(groupItems[0].layout || 'list');

    groupItems.forEach(item => {
        addProductRow(
            item.title || '',
            item.link || '',
            item.image || '',
            item.productTextColor || '#302d36',
            item.active !== false,
            item.id
        );
    });

    updateLivePreview();

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}

function renderLists() {
    const listDiv = document.getElementById('admin-list');
    const analyticsDiv =
        document.getElementById('analytics-list');

    const keyword =
        document.getElementById('searchInput')
            .value.trim().toLowerCase();

    listDiv.replaceChildren();
    analyticsDiv.replaceChildren();

    const groups = new Map();
    const items = [];

    Object.entries(allProductsData).forEach(([id, item]) => {
        if (!item) return;

        const record = {
            ...item,
            id
        };

        items.push(record);

        const name = item.group || '기타';

        if (!groups.has(name)) {
            groups.set(name, []);
        }

        groups.get(name).push(record);
    });

    let visibleGroups = 0;

    
[...groups.entries()]
    .sort((a, b) => {

        const getCreatedAt = (items) => {
            const times = items.map(item => {
                if (Number.isFinite(Number(item.createdAt)) &&
                    Number(item.createdAt) > 0) {
                    return Number(item.createdAt);
                }

                // 과거 상품은 Firebase push ID를 기준으로 처리
                return item.id || '';
            });

            const numericTimes = times.filter(
                value => typeof value === 'number'
            );

            return numericTimes.length
                ? Math.min(...numericTimes)
                : 0;
        };

        return getCreatedAt(b[1]) - getCreatedAt(a[1]);
    })
    .forEach(([groupName, groupItems]) => {


            const matched =
                groupName.toLowerCase().includes(keyword) ||
                groupItems.some(item =>
                    String(item.title || '')
                        .toLowerCase().includes(keyword)
                );

            if (!matched) return;

            visibleGroups++;

            const first = groupItems[0];
            const activeCount = groupItems.filter(item =>
                item.active !== false
            ).length;

            const div = document.createElement('div');
            div.className = 'admin-item';

            const info = document.createElement('div');
            info.className = 'admin-item-info';

            const img = document.createElement('img');
            img.className = 'admin-thumb';
            img.alt = '상품 썸네일';

            if (safeImage(first.image)) {
                img.src = first.image;
            }

            const textBox = document.createElement('div');

            const name = document.createElement('div');
            name.className = 'item-name';
            name.textContent = '📁 ' + groupName;

            const meta = document.createElement('div');
            meta.className = 'item-meta';
            meta.textContent =
                '상품 ' + groupItems.length +
                '개 · 게시 ' + activeCount + '개';

            textBox.appendChild(name);
            textBox.appendChild(meta);

            info.appendChild(img);
            info.appendChild(textBox);

            const actions = document.createElement('div');
            actions.className = 'admin-btn-group';

            const editBtn = document.createElement('button');
            editBtn.className = 'btn-edit';
            editBtn.textContent = '그룹 수정';
            editBtn.onclick = () => editGroup(groupName);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'btn-del';
            deleteBtn.textContent = '그룹 삭제';
            deleteBtn.onclick = () => deleteGroup(groupName);

            actions.appendChild(editBtn);
            actions.appendChild(deleteBtn);

            div.appendChild(info);
            div.appendChild(actions);
            listDiv.appendChild(div);
        }
    );

    if (!visibleGroups) {
        listDiv.innerHTML =
            '<div class="empty-text">검색된 그룹이 없습니다.</div>';
    }

    /* 클릭 순위 */
    items.sort((a, b) =>
        Number(b.clicks || 0) - Number(a.clicks || 0)
    );

    items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'analytics-item';

        const info = document.createElement('div');
        info.className = 'admin-item-info';

        const img = document.createElement('img');
        img.className = 'admin-thumb';
        img.alt = '상품 이미지';

        if (safeImage(item.image)) {
            img.src = item.image;
        }

        const textBox = document.createElement('div');

        const name = document.createElement('div');
        name.className = 'item-name';
        name.textContent =
            (index + 1) + '위 · ' + (item.title || '상품명 없음');

        const group = document.createElement('div');
        group.className = 'item-meta';
        group.textContent = item.group || '';

        textBox.appendChild(name);
        textBox.appendChild(group);

        info.appendChild(img);
        info.appendChild(textBox);

        const count = document.createElement('span');
        count.className = 'click-count';
        count.textContent =
            '🖱️ ' + formatNumber(item.clicks) + '회';

        div.appendChild(info);
        div.appendChild(count);

        analyticsDiv.appendChild(div);
    });

    if (!items.length) {
        analyticsDiv.innerHTML =
            '<div class="empty-text">클릭 통계가 없습니다.</div>';
    }
}

/* ========================================
   초기 실행
======================================== */

window.addEventListener('load', () => {
    addProductRow();
    updateLivePreview();
});

</script>
</body>
</html>
