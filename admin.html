<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeStyle 관리자 UI</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .admin-box { background: #fff; width: 100%; max-width: 500px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2, h3 { margin-bottom: 15px; text-align: center; color: #333; }
        label { font-size: 12px; font-weight: bold; color: #666; margin-top: 10px; display: block; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #ddd; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: #ff4757; color: #fff; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 드래그 앤 드롭 박스 스타일 */
        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            background: #fafafa;
            color: #666;
            font-size: 13px;
            margin-top: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .drop-zone.dragover {
            background: #ffe5e8;
            border-color: #ff4757;
            color: #ff4757;
        }
        .drop-zone img {
            max-width: 80px;
            max-height: 80px;
            margin-top: 8px;
            border-radius: 4px;
            object-fit: cover;
        }

        button.btn-add { background: #ff4757; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        button.btn-add:hover { background: #e03847; }
        button.btn-profile { background: #2f3542; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }
        button.btn-profile:hover { background: #57606f; }
        
        .search-input { margin-bottom: 15px; }
        .item-list, .analytics-section { margin-top: 15px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #fafafa; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #eee; font-size: 13px; }
        .analytics-item { display: flex; justify-content: space-between; align-items: center; background: #fff8f8; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #ffdede; font-size: 13px; }
        .click-count { font-weight: bold; color: #ff4757; background: rgba(255,71,87,0.1); padding: 3px 8px; border-radius: 12px; }
        .btn-del { background: #333; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; width: auto; font-size: 12px; }
        hr { border: 0; height: 1px; background: #eee; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="admin-box">
        <h2>🛠️ 채널 통합 관리자</h2>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('manage')">📦 상품 및 설정</button>
            <button class="tab-btn" onclick="switchTab('analytics')">📊 분석 대시보드</button>
        </div>

        <div id="tab-manage" class="tab-content active">
            <label>프로필 이미지 (드래그 또는 파일 선택)</label>
            <div id="profileDropZone" class="drop-zone">
                📁 프로필 이미지를 여기에 드래그하거나 클릭하세요
                <input type="file" id="profileFileInput" accept="image/*" style="display:none;">
                <div id="profilePreview"></div>
            </div>
            <button class="btn-profile" onclick="updateProfileImage()">👤 프로필 이미지 변경하기</button>

            <hr>

            <h3>➕ 상품 등록</h3>
            <label>그룹 (카테고리)</label>
            <input type="text" id="group" placeholder="예: 🎃 10월 할로윈 꿀템 TOP 3">

            <label>상품명</label>
            <input type="text" id="title" placeholder="예: 할로윈 LED 호박등 3종 세트">

            <label>쿠팡 파트너스 링크</label>
            <input type="text" id="link" placeholder="https://link.coupang.com/...">

            <label>상품 이미지 (드래그 또는 파일 선택)</label>
            <div id="productDropZone" class="drop-zone">
                🖼️ 상품 이미지를 여기에 드래그하거나 클릭하세요
                <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
                <div id="productPreview"></div>
            </div>

            <button class="btn-add" onclick="addProductWithFile()">➕ 상품 등록하기</button>

            <div class="item-list">
                <h3>📋 등록된 상품 목록</h3>
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 상품명 또는 그룹 검색..." oninput="filterAdminList()">
                <div id="admin-list"></div>
            </div>
        </div>

        <div id="tab-analytics" class="tab-content">
            <h3>📊 BEST 클릭 순위 (실시간)</h3>
            <p style="font-size:11px; color:#888; text-align:center; margin-bottom:15px;">어떤 상품이 시청자들의 클릭을 많이 받았는지 확인하세요.</p>
            <div class="analytics-section" id="analytics-list">
                <p style="font-size:12px; color:#888; text-align:center;">집계된 데이터가 없습니다.</p>
            </div>
        </div>
    </div>

    <script>
        // ★ 본인의 Firebase 설정값으로 교체하세요! ★
        const firebaseConfig = {
  apiKey: "AIzaSyCMy4vdbdLd26v8l2kGTsCW-IZaGklqwLs",
  authDomain: "freestyle-db-becce.firebaseapp.com",
  projectId: "freestyle-db-becce",
  storageBucket: "freestyle-db-becce.firebasestorage.app",
  messagingSenderId: "811035384445",
  appId: "1:811035384445:web:490ffeb5f09cb763f0ef14",
  measurementId: "G-FY7T44KY7D"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allProductsData = {};
        let profileBase64 = "";
        let productBase64 = "";

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'manage') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-manage').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-analytics').classList.add('active');
            }
        }

        // 파일 Base64 변환 헬퍼
        function convertFileToBase64(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                callback(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        // 드래그 앤 드롭 이벤트 설정 함수
        function setupDropZone(dropZoneId, fileInputId, previewId, isProfile) {
            const dropZone = document.getElementById(dropZoneId);
            const fileInput = document.getElementById(fileInputId);
            const preview = document.getElementById(previewId);

            dropZone.onclick = function() {
                fileInput.click();
            };

            fileInput.onchange = function(e) {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            };

            dropZone.ondragover = function(e) {
                e.preventDefault();
                dropZone.classList.add('dragover');
            };

            dropZone.ondragleave = function() {
                dropZone.classList.remove('dragover');
            };

            dropZone.ondrop = function(e) {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            };

            function handleFile(file) {
                convertFileToBase64(file, function(base64Str) {
                    if (isProfile) {
                        profileBase64 = base64Str;
                    } else {
                        productBase64 = base64Str;
                    }
                    preview.innerHTML = '<img src="' + base64Str + '" alt="미리보기">';
                });
            }
        }

        // 드래그 존 활성화 실행
        setupDropZone('profileDropZone', 'profileFileInput', 'profilePreview', true);
        setupDropZone('productDropZone', 'imageFileInput', 'productPreview', false);

        function updateProfileImage() {
            if (!profileBase64) {
                alert('변경할 프로필 이미지 파일을 드래그하거나 선택해주세요!');
                return;
            }

            db.ref('settings').set({ profileImg: profileBase64 }, function(err) {
                if(err) alert('변경 실패!');
                else {
                    alert('프로필 이미지가 성공적으로 변경되었습니다!');
                    profileBase64 = "";
                    document.getElementById('profilePreview').innerHTML = '';
                }
            });
        }

        function addProductWithFile() {
            const group = document.getElementById('group').value.trim();
            const title = document.getElementById('title').value.trim();
            const link = document.getElementById('link').value.trim();

            if(!group || !title || !link) {
                alert('그룹, 상품명, 링크는 필수 입력입니다!');
                return;
            }

            if(!productBase64) {
                alert('상품 이미지 파일을 드래그하거나 선택해주세요!');
                return;
            }

            db.ref('products').push({ 
                group: group, 
                title: title, 
                link: link, 
                image: productBase64, 
                clicks: 0 
            }, function(err) {
                if(err) {
                    alert('등록 실패: ' + err.message);
                } else {
                    alert('성공적으로 등록되었습니다!');
                    document.getElementById('title').value = '';
                    document.getElementById('link').value = '';
                    productBase64 = "";
                    document.getElementById('productPreview').innerHTML = '';
                }
            });
        }

        db.ref('products').on('value', function(snapshot) {
            allProductsData = snapshot.val() || {};
            renderLists();
        });

        function renderLists() {
            const listDiv = document.getElementById('admin-list');
            const analyticsDiv = document.getElementById('analytics-list');
            listDiv.innerHTML = '';
            analyticsDiv.innerHTML = '';

            if(Object.keys(allProductsData).length === 0) {
                analyticsDiv.innerHTML = '<p style="font-size:12px; color:#888; text-align:center;">집계된 데이터가 없습니다.</p>';
                return;
            }

            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const keys = Object.keys(allProductsData).reverse();

            keys.forEach(function(id) {
                const item = allProductsData[id];
                const textCheck = (item.group + ' ' + item.title).toLowerCase();
                
                if (keyword && !textCheck.includes(keyword)) return;

                const div = document.createElement('div');
                div.className = 'admin-item';
                div.innerHTML = '<div><strong>[' + item.group + ']</strong> ' + item.title + '</div>' +
                                '<button class="btn-del" onclick="deleteProduct(\'' + id + '\')">삭제</button>';
                listDiv.appendChild(div);
            });

            const itemsArray = [];
            Object.keys(allProductsData).forEach(function(id) {
                const obj = allProductsData[id];
                obj.id = id;
                itemsArray.push(obj);
            });

            itemsArray.sort(function(a, b) {
                return (b.clicks || 0) - (a.clicks || 0);
            });

            itemsArray.forEach(function(item) {
                const div = document.createElement('div');
                div.className = 'analytics-item';
                div.innerHTML = '<div><strong>' + item.title + '</strong> <span style="font-size:11px; color:#888;">(' + item.group + ')</span></div>' +
                                '<span class="click-count">🖱️ ' + (item.clicks || 0) + '회</span>';
                analyticsDiv.appendChild(div);
            });
        }

        function filterAdminList() {
            renderLists();
        }

        function deleteProduct(id) {
            if(confirm('정말 삭제하시겠습니까?')) {
                db.ref('products/' + id).remove();
            }
        }
    </script>
</body>
</html>
