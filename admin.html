<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeStyle 관리자 UI</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .admin-box { background: #fff; width: 100%; max-width: 550px; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2, h3 { margin-bottom: 15px; text-align: center; color: #333; }
        label { font-size: 12px; font-weight: bold; color: #666; margin-top: 10px; display: block; }
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        
        .tab-menu { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 8px 4px; background: #ddd; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; text-align: center; }
        .tab-btn.active { background: #ff4757; color: #fff; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .profile-preview-box { text-align: center; margin-bottom: 15px; }
        .current-profile-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid #ddd; background: #eee; }
        .file-box { border: 1px solid #ccc; border-radius: 6px; padding: 10px; background: #fafafa; margin-top: 5px; }

        .product-input-card { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-top: 10px; position: relative; }
        .btn-remove-row { background: #333; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-top: 8px; width: auto; float: right; }
        
        /* [+] 드래그 앤 드롭 업로드 박스 스타일 */
        .image-drop-zone {
            width: 80px;
            height: 80px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            margin-top: 5px;
            transition: 0.2s;
        }
        .image-drop-zone:hover, .image-drop-zone.dragover {
            border-color: #ff4757;
            background: #fff0f1;
        }
        .image-drop-zone span.plus-icon {
            font-size: 24px;
            color: #aaa;
        }
        .image-drop-zone img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 우측 하단 삭제(휴지통) 버튼 스타일 */
        .btn-delete-img {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .btn-delete-img:hover {
            background: #e03847;
        }

        .btn-add-row { background: #2f3542; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; font-size: 13px; }
        .btn-add-row:hover { background: #57606f; }
        
        button.btn-action { background: #ff4757; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 20px; font-size: 15px; }
        button.btn-action:hover { background: #e03847; }
        button.btn-profile { background: #2f3542; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
        
        .search-input { margin-bottom: 15px; }
        .item-list, .analytics-section { margin-top: 15px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #fafafa; padding: 8px 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #eee; font-size: 13px; }
        .admin-item-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .admin-thumb { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; background: #ddd; flex-shrink: 0; }
        
        .admin-btn-group { display: flex; gap: 4px; flex-shrink: 0; }
        .btn-edit { background: #009432; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-del { background: #333; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-cancel { background: #666; color: #fff; margin-top: 10px; }

        .analytics-item { display: flex; justify-content: space-between; align-items: center; background: #fff8f8; padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid #ffdede; font-size: 13px; }
        .click-count { font-weight: bold; color: #ff4757; background: rgba(255,71,87,0.1); padding: 3px 8px; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="admin-box">
        <h2>🛠️ 채널 통합 관리자</h2>

        <div class="tab-menu">
            <button class="tab-btn active" onclick="switchTab('manage')">📦 상품 관리</button>
            <button class="tab-btn" onclick="switchTab('profile')">⚙️ 프로필 설정</button>
            <button class="tab-btn" onclick="switchTab('analytics')">📊 분석 대시보드</button>
        </div>

        <!-- [탭 1] 그룹형 상품 등록 및 수정 관리 -->
        <div id="tab-manage" class="tab-content active">
            <h3 id="formModeTitle">➕ 그룹 상품 등록</h3>
            <input type="hidden" id="editingGroupName" value="">

            <label>대표 문구 (그룹 제목)</label>
            <input type="text" id="groupTitleInput" placeholder="그룹 링크 상단에 문구가 노출됩니다.[cite: 3]">

            <label style="margin-top:15px; font-weight:bold; color:#ff4757;">링크 목록</label>
            <div id="productRowsContainer"></div>

            <button class="btn-add-row" onclick="addProductRow()">+ 링크 추가</button>
            <button class="btn-action" id="submitBtn" onclick="saveGroupProducts()">🚀 그룹 상품 한 번에 등록하기</button>
            <button class="btn-action btn-cancel" id="cancelBtn" onclick="resetFormMode()" style="display:none;">취소 (신규 등록 모드로 전환)</button>

            <hr style="margin: 25px 0;">

            <div class="item-list">
                <h3>📋 등록된 그룹 목록 (수정/삭제)</h3>
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 상품명 또는 그룹 검색..." oninput="filterAdminList()">
                <div id="admin-list"></div>
            </div>
        </div>

        <!-- [탭 2] 프로필 설정 -->
        <div id="tab-profile" class="tab-content">
            <h3>👤 프로필 설정</h3>
            <p style="font-size:11px; color:#888; text-align:center; margin-bottom:20px;">메인 페이지 상단에 노출될 프로필 이미지를 관리합니다.[cite: 3]</p>
            
            <label style="text-align:center;">현재 프로필 이미지</label>
            <div class="profile-preview-box">
                <img id="currentProfileView" class="current-profile-img" src="" alt="프로필">
            </div>

            <label>새 프로필 이미지 선택</label>
            <div class="file-box">
                <input type="file" id="profileFileInput" accept="image/*">
            </div>

            <button class="btn-profile" onclick="updateProfileImage()">💾 프로필 이미지 변경 저장하기</button>
        </div>

        <!-- [탭 3] 분석 대시보드 -->
        <div id="tab-analytics" class="tab-content">
            <h3>📊 BEST 클릭 순위 (실시간)</h3>
            <p style="font-size:11px; color:#888; text-align:center; margin-bottom:15px;">어떤 상품이 시청자들의 클릭을 많이 받았는지 확인하세요.[cite: 3]</p>
            <div class="analytics-section" id="analytics-list">
                <p style="font-size:12px; color:#888; text-align:center;">집계된 데이터가 없습니다.[cite: 3]</p>
            </div>
        </div>
    </div>

    <script>
        // ★ 본인의 Firebase 설정값 ★
        const firebaseConfig = {
  apiKey: "AIzaSyCMy4vdbdLd26v8l2kGTsCW-IZaGklqwLs",
  authDomain: "freestyle-db-becce.firebaseapp.com",
  projectId: "freestyle-db-becce",
  storageBucket: "freestyle-db-becce.firebasestorage.app",
  messagingSenderId: "811035384445",
  appId: "1:811035384445:web:490ffeb5f09cb763f0ef14",
  measurementId: "G-FY7T44KY7D"
};


        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allProductsData = {};

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'manage') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-manage').classList.add('active');
            } else if (tabName === 'profile') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-profile').classList.add('active');
            } else if (tabName === 'analytics') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('tab-analytics').classList.add('active');
            }
        }

        window.onload = function() {
            addProductRow();
        };

        // 상품 입력 행 추가 (이미지 업로드 + 우측 하단 삭제 버튼 UI 적용)[cite: 5]
        function addProductRow(titleVal = '', linkVal = '', imageVal = '') {
            const container = document.getElementById('productRowsContainer');
            const uniqueId = 'row_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            
            const card = document.createElement('div');
            card.className = 'product-input-card';
            card.id = uniqueId;
            card.innerHTML = `
                <label>상품명</label>
                <input type="text" class="row-title" value="${titleVal}" placeholder="버튼에 문구가 노출됩니다.[cite: 3]">
                
                <label>쿠팡 파트너스 링크</label>
                <input type="text" class="row-link" value="${linkVal}" placeholder="https://link.coupang.com/...">
                
                <label>이미지</label>
                <div style="position: relative; display: inline-block;">
                    <div class="image-drop-zone" id="dropZone_${uniqueId}">
                        <span class="plus-icon" id="dropIcon_${uniqueId}" style="${imageVal ? 'display:none;' : ''}">+</span>
                        <input type="file" class="row-file" accept="image/*" style="display:none;" id="fileInput_${uniqueId}">
                        <img id="previewImg_${uniqueId}" src="${imageVal || ''}" style="${imageVal ? '' : 'display:none;'}">
                    </div>
                    <button type="button" class="btn-delete-img" id="delImgBtn_${uniqueId}" style="${imageVal ? '' : 'display:none;'}" onclick="removeImage('${uniqueId}')">🗑️</button>
                </div>
                <input type="hidden" class="row-existing-image" id="existingImg_${uniqueId}" value="${imageVal}">

                <button class="btn-remove-row" onclick="document.getElementById('${uniqueId}').remove()">행 삭제</button>
                <div style="clear:both;"></div>
            `;
            container.appendChild(card);

            const dropZone = document.getElementById(`dropZone_${uniqueId}`);
            const fileInput = document.getElementById(`fileInput_${uniqueId}`);
            const previewImg = document.getElementById(`previewImg_${uniqueId}`);
            const dropIcon = document.getElementById(`dropIcon_${uniqueId}`);
            const delImgBtn = document.getElementById(`delImgBtn_${uniqueId}`);
            const existingImgInput = document.getElementById(`existingImg_${uniqueId}`);

            dropZone.onclick = function(e) {
                if (e.target !== delImgBtn) {
                    fileInput.click();
                }
            };

            fileInput.onchange = function(e) {
                if (e.target.files.length > 0) {
                    processFile(e.target.files[0]);
                }
            };

            dropZone.ondragover = function(e) {
                e.preventDefault();
                dropZone.classList.add('dragover');
            };

            dropZone.ondragleave = function() {
                dropZone.classList.remove('dragover');
            };

            dropZone.ondrop = function(e) {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    fileInput.files = e.dataTransfer.files;
                    processFile(e.dataTransfer.files[0]);
                }
            };

            function processFile(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Str = e.target.result;
                    previewImg.src = base64Str;
                    previewImg.style.display = 'block';
                    dropIcon.style.display = 'none';
                    delImgBtn.style.display = 'flex';
                    existingImgInput.value = base64Str;
                };
                reader.readAsDataURL(file);
            }
        }

        // 등록된 이미지 삭제 버튼 클릭 시 초기화
        function removeImage(uniqueId) {
            const previewImg = document.getElementById(`previewImg_${uniqueId}`);
            const dropIcon = document.getElementById(`dropIcon_${uniqueId}`);
            const delImgBtn = document.getElementById(`delImgBtn_${uniqueId}`);
            const existingImgInput = document.getElementById(`existingImg_${uniqueId}`);
            const fileInput = document.getElementById(`fileInput_${uniqueId}`);

            previewImg.src = '';
            previewImg.style.display = 'none';
            dropIcon.style.display = 'block';
            delImgBtn.style.display = 'none';
            existingImgInput.value = '';
            fileInput.value = '';
        }

        function saveGroupProducts() {
            const groupTitle = document.getElementById('groupTitleInput').value.trim();
            const editingGroupName = document.getElementById('editingGroupName').value.trim();

            if (!groupTitle) {
                alert('대표 문구(그룹 제목)를 입력해주세요!');
                return;
            }

            const cards = document.querySelectorAll('.product-input-card');
            if (cards.length === 0) {
                alert('등록할 상품을 최소 1개 이상 추가해주세요!');
                return;
            }

            let hasError = false;
            cards.forEach(card => {
                const title = card.querySelector('.row-title').value.trim();
                const link = card.querySelector('.row-link').value.trim();
                const existingImg = card.querySelector('.row-existing-image').value;

                if (!title || !link || !existingImg) {
                    hasError = true;
                }
            });

            if (hasError) {
                alert('모든 상품의 상품명, 링크, 이미지를 빠짐없이 입력해주세요!');
                return;
            }

            if (editingGroupName) {
                Object.keys(allProductsData).forEach(id => {
                    if (allProductsData[id].group === editingGroupName) {
                        db.ref('products/' + id).remove();
                    }
                });
            }

            let processedCount = 0;
            cards.forEach((card) => {
                const title = card.querySelector('.row-title').value.trim();
                const link = card.querySelector('.row-link').value.trim();
                const imgBase64 = card.querySelector('.row-existing-image').value;

                db.ref('products').push({
                    group: groupTitle,
                    title: title,
                    link: link,
                    image: imgBase64,
                    clicks: 0
                }, function(err) {
                    processedCount++;
                    if (processedCount === cards.length) {
                        alert(editingGroupName ? '그룹이 성공적으로 수정되었습니다!' : '그룹 상품이 성공적으로 등록되었습니다!');
                        resetFormMode();
                    }
                });
            });
        }

        function editGroup(groupName) {
            document.getElementById('editingGroupName').value = groupName;
            document.getElementById('groupTitleInput').value = groupName;
            document.getElementById('formModeTitle').innerText = '✏️ 그룹 수정 모드 (' + groupName + ')';
            document.getElementById('submitBtn').innerText = '💾 수정 사항 저장하기';
            document.getElementById('cancelBtn').style.display = 'block';

            document.getElementById('productRowsContainer').innerHTML = '';

            Object.keys(allProductsData).forEach(id => {
                const item = allProductsData[id];
                if (item.group === groupName) {
                    addProductRow(item.title, item.link, item.image);
                }
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFormMode() {
            document.getElementById('editingGroupName').value = '';
            document.getElementById('groupTitleInput').value = '';
            document.getElementById('formModeTitle').innerText = '➕ 그룹 상품 등록';
            document.getElementById('submitBtn').innerText = '🚀 그룹 상품 한 번에 등록하기';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('productRowsContainer').innerHTML = '';
            addProductRow();
        }

        db.ref('settings/profileImg').on('value', function(snapshot) {
            const url = snapshot.val();
            const imgEl = document.getElementById('currentProfileView');
            if (url) {
                imgEl.src = url;
            } else {
                imgEl.src = 'https://via.placeholder.com/90?text=🔥';
            }
        });

        function updateProfileImage() {
            const fileInput = document.getElementById('profileFileInput');
            if (fileInput.files.length === 0) {
                alert('변경할 프로필 이미지 파일을 선택해주세요!');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Str = e.target.result;
                db.ref('settings').set({ profileImg: base64Str }, function(err) {
                    if(err) alert('변경 실패: ' + err.message);
                    else {
                        alert('프로필 이미지가 성공적으로 변경되었습니다!');
                        fileInput.value = '';
                    }
                });
            };
            reader.readAsDataURL(file);
        }

        db.ref('products').on('value', function(snapshot) {
            allProductsData = snapshot.val() || {};
            renderLists();
        });

        function renderLists() {
            const listDiv = document.getElementById('admin-list');
            const analyticsDiv = document.getElementById('analytics-list');
            listDiv.innerHTML = '';
            analyticsDiv.innerHTML = '';

            if(Object.keys(allProductsData).length === 0) {
                analyticsDiv.innerHTML = '<p style="font-size:12px; color:#888; text-align:center;">집계된 데이터가 없습니다.[cite: 3]</p>';
                return;
            }

            const keyword = document.getElementById('searchInput').value.toLowerCase();
            
            const groupsMap = {};
            Object.keys(allProductsData).reverse().forEach(function(id) {
                const item = allProductsData[id];
                if (!groupsMap[item.group]) {
                    groupsMap[item.group] = item;
                    groupsMap[item.group].id = id;
                }
            });

            Object.keys(groupsMap).forEach(function(groupName) {
                const item = groupsMap[groupName];
                const textCheck = (groupName + ' ' + item.title).toLowerCase();
                
                if (keyword && !textCheck.includes(keyword)) return;

                const div = document.createElement('div');
                div.className = 'admin-item';
                div.innerHTML = `
                    <div class="admin-item-info">
                        <img src="${item.image || 'https://via.placeholder.com/40'}" class="admin-thumb" alt="썸네일">
                        <div><strong>📁 ${groupName}</strong></div>
                    </div>
                    <div class="admin-btn-group">
                        <button class="btn-edit" onclick="editGroup('${groupName}')">그룹 수정</button>
                        <button class="btn-del" onclick="deleteGroup('${groupName}')">그룹 삭제</button>
                    </div>
                `;
                listDiv.appendChild(div);
            });

            const itemsArray = [];
            Object.keys(allProductsData).forEach(function(id) {
                const obj = allProductsData[id];
                obj.id = id;
                itemsArray.push(obj);
            });

            itemsArray.sort(function(a, b) {
                return (b.clicks || 0) - (a.clicks || 0);
            });

            itemsArray.forEach(function(item) {
                const div = document.createElement('div');
                div.className = 'analytics-item';
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:8px;">
                        <img src="${item.image || 'https://via.placeholder.com/35'}" style="width:35px; height:35px; border-radius:4px; object-fit:cover;" alt="썸네일">
                        <div><strong>${item.title}</strong> <span style="font-size:11px; color:#888;">(${item.group})</span></div>
                    </div>
                    <span class="click-count">🖱️ ${item.clicks || 0}회</span>
                `;
                analyticsDiv.appendChild(div);
            });
        }

        function filterAdminList() {
            renderLists();
        }

        function deleteGroup(groupName) {
            if(confirm(`'${groupName}' 그룹에 속한 모든 상품을 삭제하시겠습니까?`)) {
                Object.keys(allProductsData).forEach(id => {
                    if (allProductsData[id].group === groupName) {
                        db.ref('products/' + id).remove();
                    }
                });
            }
        }
    </script>
</body>
</html>
